# The listening pass (docs/engineering/JOBS.md §3.4): one job of up to 500 songs analysed by their
# sha256 only, or the neighbours step once every song is done. The mind's night shift starts it
# (`th music jobs`) with the job's id as the only input, so no hash ever shows on this public run page;
# the run fetches its spec from the Worker with the ci key, reads each song from `jarvis-music` with a
# read-only key, and sends back numbers only, through the Worker, which checks every one.
# The public log carries counts and timings only (JOBS.md §2): the Python job prints nothing else, and
# any failure as `fail: <reason>` from a fixed list. Secrets reach only the step that uses them, through
# env. Runs only from main, one at a time, never on a pull request.
name: Jobs · audio
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: The job's id, from GET /v1/jobs/next
        required: true
        type: string
permissions: {}
concurrency:
  group: jobs-audio
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  audio:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    environment: jobs
    permissions:
      contents: read
    steps:
      - name: Check the job id
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "fail: bad_job_id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # opus-tools (BSD) decodes; every Python package is pinned with its hash (jobs/audio/requirements*.txt).
      - name: Install the decoder and the analyzer
        run: |
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -y -qq --no-install-recommends opus-tools > /dev/null
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --no-deps --only-binary=:all: \
            -r jobs/audio/requirements.txt -r jobs/audio/requirements-clap.txt
      # Synthetic tones with known answers, before any real song is touched.
      - name: Self-test
        env:
          JOBS_MODEL_CACHE: ${{ runner.temp }}/model
        run: '"$RUNNER_TEMP/venv/bin/python" -m jobs.audio --selftest --clap'
      - name: Analyse
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOBS_MODEL_CACHE: ${{ runner.temp }}/model
          TH_API: ${{ vars.WORKER_URL }}
          TH_CI_TOKEN: ${{ secrets.TH_CI_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_JOBS_ACCESS_KEY_ID: ${{ secrets.R2_JOBS_ACCESS_KEY_ID }}
          R2_JOBS_SECRET: ${{ secrets.R2_JOBS_SECRET }}
        run: '"$RUNNER_TEMP/venv/bin/python" -m jobs.audio --job "$JOB_ID"'
