# Open setup (SIGN-IN.md §4.1): pipes the repository secret TH_SETUP_FINGERPRINT into the Worker secret AUTH_SETUP_FP on
# stdin and prints only its last 4 characters. With `clear`, it writes the literal `none`
# instead (never `wrangler secret delete`: the name is in secrets.required, so deleting it would
# block every later deploy). The Worker treats unset, empty and `none` alike.
name: Open setup
on:
  workflow_dispatch:
    inputs:
      clear:
        description: Set AUTH_SETUP_FP back to none
        type: boolean
        default: false
permissions: {}
concurrency:
  group: worker-secret
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  put:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: worker
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Put AUTH_SETUP_FP
        env:
          FINGERPRINT: ${{ secrets.TH_SETUP_FINGERPRINT }}
          CLEAR: ${{ inputs.clear }}
        run: |
          if [[ "$CLEAR" == true ]]; then
            value=none
          else
            [[ "$FINGERPRINT" =~ ^thfp_[A-Za-z0-9_-]{43}$ ]] || { echo "::error::TH_SETUP_FINGERPRINT must be a thfp_ fingerprint (48 characters)"; exit 1; }
            value="$FINGERPRINT"
          fi
          printf '%s' "$value" | npx wrangler secret put AUTH_SETUP_FP --config backend/wrangler.jsonc > /dev/null
          if [[ "$value" == none ]]; then echo "AUTH_SETUP_FP set to none"; else echo "Fingerprint installed (ends …${value: -4})"; fi
