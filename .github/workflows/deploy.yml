# Every push to main: test, publish the site to the Azure Storage static website, then check
# it live. If anything fails or is cancelled after publishing starts, the previous live commit
# goes back up and the run is marked failed.
# Manual deploy or rollback: Actions > Deploy > Run workflow (from main), with the commit to put live.
name: Deploy
run-name: Deploy ${{ inputs.ref || github.sha }}
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to put live (empty = tip of main)
        type: string
        required: false
permissions: {}
concurrency:
  group: deploy-site
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  site:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Only commits on main go live
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Test before publishing
        env:
          SITE_URL: ''
        run: npm test
      - name: Note what is live now
        id: before
        run: |
          prev="$(curl -fsS --max-time 20 --retry 2 "${SITE_URL%/}/release.json" | sed -n 's/.*"commit":"\([0-9a-f]\{40\}\)".*/\1/p' || true)"
          echo "commit=$prev" >> "$GITHUB_OUTPUT"
          echo "live before: ${prev:-nothing}"
      - name: Stage
        run: node scripts/stage.mjs "$(git rev-parse HEAD)"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        id: login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: If sign-in failed, show the subject Azure has to trust (never the token)
        if: ${{ failure() && steps.login.outcome == 'failure' }}
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          printf '%s' "$token" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(Buffer.from(s.split(".")[1],"base64url"));console.log("Federated credential subject must be:",c.sub)})'
      - name: Publish
        id: publish
        run: scripts/deploy.sh "$(git rev-parse HEAD)"
      - name: Check the live site (read-only)
        run: |
          export EXPECTED_COMMIT="$(git rev-parse HEAD)"
          node --test tests/live.test.mjs tests/home-browser.test.mjs || { sleep 15; node --test tests/live.test.mjs tests/home-browser.test.mjs; }
      - name: Roll back to the previous live commit
        if: ${{ (failure() || cancelled()) && steps.publish.outcome != 'skipped' && steps.before.outputs.commit != '' }}
        env:
          PREV: ${{ steps.before.outputs.commit }}
        run: |
          rm -rf frontend
          git checkout "$PREV" -- frontend
          node scripts/stage.mjs "$PREV"
          scripts/deploy.sh "$PREV"
