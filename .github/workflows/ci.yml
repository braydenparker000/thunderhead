# Tests every push to a branch other than main, with the same checks Deploy runs (checks.yml): the quick ones, all
# but the editor's software-GPU browser tests, which run after a release instead (slow.yml). main is tested by
# Deploy before anything goes live.
name: Test
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  # A branch that changes only lab pages, Astra, docs, the Worker or the mind runs the checks those can break, not every
  # suite (scripts/test-scope.mjs; TESTING.md §2, "Scopes"). Any doubt, or this job failing, runs everything.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lab: ${{ steps.look.outputs.lab }}
      scope: ${{ steps.look.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: look
        run: |
          verdict="$(node scripts/test-scope.mjs origin/main || echo all)"
          echo "scope: $verdict"
          word="${verdict%% *}"
          if [[ "$word" =~ ^(lab|docs|backend|mind)$ && "$verdict" == *' '* ]]; then
            echo "scope=$word" >> "$GITHUB_OUTPUT"; echo "lab=${verdict#* }" >> "$GITHUB_OUTPUT"
          else
            echo "scope=" >> "$GITHUB_OUTPUT"; echo "lab=" >> "$GITHUB_OUTPUT"
          fi
  # What this run checks, in a job name Deploy reads (scripts/tree-tested.mjs): Deploy skips its own checks only
  # after a successful run of this tree whose job is named `Scope: full`. The condition is the one `test` passes as `lab`:
  # an empty `lab` is every suite, whatever `scope` says.
  record:
    needs: scope
    if: ${{ !cancelled() }}
    name: "${{ (needs.scope.result == 'success' && needs.scope.outputs.lab) && 'Scope: narrowed' || 'Scope: full' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "the scope is this job's name"
  test:
    needs: scope
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/checks.yml
    with:
      lab: ${{ needs.scope.result == 'success' && needs.scope.outputs.lab || '' }}
      scope: ${{ needs.scope.result == 'success' && needs.scope.outputs.lab && needs.scope.outputs.scope || '' }}
      files: quick
  # The mind's weekly improvement (EVALS.md §7, RA-P9-02): its evals line must match the Worker's
  # record, no suite may drop, and it may not change an eval and the mind together.
  eval-diff:
    if: ${{ startsWith(github.ref_name, 'claude/weekly-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compared with main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Eval diff of a weekly improvement
        env:
          TH_CI_TOKEN: ${{ secrets.TH_CI_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/eval-diff.mjs --base origin/main
