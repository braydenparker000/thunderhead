# Tests every push to a branch other than main, with the same checks Deploy runs (checks.yml). main
# is tested by Deploy before anything goes live.
name: Test
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    uses: ./.github/workflows/checks.yml
  # The mind's weekly improvement (EVALS.md §7, RA-P9-02): its evals line must match the Worker's
  # record, no suite may drop, and it may not change an eval and the mind together.
  eval-diff:
    if: ${{ startsWith(github.ref_name, 'claude/weekly-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compared with main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Eval diff of a weekly improvement
        env:
          TH_CI_TOKEN: ${{ secrets.TH_CI_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/eval-diff.mjs --base origin/main
