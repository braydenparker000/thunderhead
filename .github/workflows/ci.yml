# Tests every push to a branch other than main, with the same checks Deploy runs (checks.yml). main
# is tested by Deploy before anything goes live.
name: Test
on:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  # A branch that changes only lab pages runs the lab checks, not every suite (scripts/lab-scope.mjs;
  # TESTING.md §1, "Lab changes"). Any doubt, or this job failing, runs everything.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lab: ${{ steps.look.outputs.lab }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: look
        run: |
          verdict="$(node scripts/lab-scope.mjs origin/main || echo all)"
          echo "scope: $verdict"
          if [[ "$verdict" == lab\ * ]]; then echo "lab=${verdict#lab }" >> "$GITHUB_OUTPUT"; else echo "lab=" >> "$GITHUB_OUTPUT"; fi
  test:
    needs: scope
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/checks.yml
    with:
      lab: ${{ needs.scope.result == 'success' && needs.scope.outputs.lab || '' }}
      first_only: true
  # The mind's weekly improvement (EVALS.md §7, RA-P9-02): its evals line must match the Worker's
  # record, no suite may drop, and it may not change an eval and the mind together.
  eval-diff:
    if: ${{ startsWith(github.ref_name, 'claude/weekly-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Compared with main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Eval diff of a weekly improvement
        env:
          TH_CI_TOKEN: ${{ secrets.TH_CI_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: node scripts/eval-diff.mjs --base origin/main
