# The checks a commit must pass (TESTING.md §1.1), as six jobs at once: the site and mind suites
# in five parts (scripts/test-part.mjs deals the files by measured time) and the Worker's suite. Called by
# Deploy before anything goes live and by Test on every other branch with `files: quick` (all but the
# editor's software-GPU browser tests), and by Slow after a release with `files: slow` (those only; the owner,
# 2026-11-18: "better to go live and have a good recording and reporting pipeline"). `npm test` runs all of them in one go.
name: Checks
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty = the caller's)
        type: string
        default: ''
      lab:
        description: "Test's narrowed scope (scripts/test-scope.mjs): empty = every suite; else the test files to run"
        type: string
        default: ''
      scope:
        description: "What `lab` is the scope of: lab, docs, backend or mind (ignored when `lab` is empty)"
        type: string
        default: ''
      files:
        description: "all, quick (all but the software-GPU tests: what a merge and a release wait for) or slow (those only: after a release)"
        type: string
        default: all
      first_only:
        description: "Test sets this: a re-run of these checks fails (TESTING.md §1 rule 8: a failing test is fixed, never retried into green)"
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    # 20 (15 until 2026-11-16, 10 until 2026-11-13): CI's machine makes the software-GPU tests about twice as slowly as
    # the measured table says, and a part that had passed for weeks ran out of time with nothing failing; on 2026-11-16
    # a part ran out at 14:59 with every test passed. A stalled test is still caught in five minutes (test-part.mjs QUIET).
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        part: [site 1/5, site 2/5, site 3/5, site 4/5, site 5/5, worker]
    steps:
      # A failing test is fixed, never retried into green (TESTING.md §1 rule 8). The rule was broken by hand three
      # times in one day (2026-11-14), each re-run hiding a test that failed again later, so on a branch a re-run
      # cannot pass: the way to green is a commit that fixes what failed. Deploy does not set this (its job re-run
      # after an outage must stay possible); the same checks passed on the branch first.
      - if: ${{ inputs.first_only && github.run_attempt > 1 }}
        run: |
          echo "::error::A re-run of the checks does not count: a failing test is fixed, not retried into green (docs/engineering/TESTING.md §1, rule 8). Push the fix."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # npm's cache is kept by the lockfile, Playwright's browser by Playwright's version: each part fetched both every run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          cache: ${{ (((inputs.lab == '' || inputs.scope == 'backend') && inputs.files != 'slow') || matrix.part != 'worker') && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      # A narrowed change (TESTING.md §2, "Scopes"): the site's parts run its tests between them; the Worker's runs only
      # for every suite or a Worker change. Docs, Worker and mind scopes hold no browser test, so need no browser or font.
      - if: ${{ ((inputs.lab == '' || inputs.scope == 'backend') && inputs.files != 'slow') || matrix.part != 'worker' }}
        run: npm ci --ignore-scripts
      - id: browser
        if: ${{ matrix.part != 'worker' && (inputs.lab == '' || inputs.scope == 'lab') }}
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        if: ${{ steps.browser.outcome == 'success' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.version }}-chromium-headless-shell
      - if: ${{ steps.browser.outcome == 'success' && steps.browser-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps --only-shell chromium
      # The cache holds the browser, not the system's libraries it needs: those are still installed.
      - if: ${{ steps.browser.outcome == 'success' && steps.browser-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium
      # Switzer is fetched, not kept here (its licence forbids a public repository; scripts/fonts.mjs).
      - if: ${{ steps.browser.outcome == 'success' }}
        run: node scripts/fonts.mjs
      # Local checks only: the live checks run after a deploy, against what went live.
      - name: Test
        env:
          PART: ${{ matrix.part }}
          SITE_URL: ''
          WORKER_URL: ''
          DRIVE_CONFIG_JSON: ''
          LAB: ${{ inputs.lab }}
          SCOPE: ${{ inputs.scope }}
          FILES: ${{ inputs.files }}
        run: |
          kind=(); if [[ "$FILES" == quick || "$FILES" == slow ]]; then kind=("--$FILES"); fi
          if [[ "$FILES" == slow && "$PART" == worker ]]; then echo "the Worker's suite has no software-GPU tests"; exit 0; fi
          if [[ -n "$LAB" ]]; then
            if [[ "$PART" == worker && "$SCOPE" == backend ]]; then npm run test:backend; exit; fi
            if [[ "$PART" == worker ]]; then echo "$SCOPE change: the Worker's suite is not run"; exit 0; fi
            # part 1: the checks a scope's files feed. A lab change: the types, the contract and the page budgets as
            # preflight checks them. The Worker and the contract: the types and the contract's copies. Docs and the mind:
            # the contract's copies (docs/engineering/CONTRACT.md and mind/cli/contract.json are among them). `|| exit 1`:
            # bash's -e does not stop at a failure inside an && list, so without it a failed type check went on to the tests.
            if [[ "$PART" == 'site 1/5' && "$FILES" != slow ]]; then
              case "$SCOPE" in
                backend) { npx tsc && node scripts/contract.mjs --check; } || exit 1 ;;
                docs|mind) node scripts/contract.mjs --check || exit 1 ;;
                *) { npx tsc && node scripts/contract.mjs --check && node scripts/stage.mjs "$(git rev-parse HEAD)"; } || exit 1 ;;
              esac
            fi
            # then the scope's tests, dealt over the five parts as the whole suite is (one part could not hold the editor's in its time)
            read -ra files <<< "$LAB"
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}" "${kind[@]}" --only "${files[@]}"
          elif [[ "$PART" == worker ]]; then
            npm run test:backend
          else
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}" "${kind[@]}"
          fi
