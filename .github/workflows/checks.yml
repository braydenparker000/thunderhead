# The checks a commit must pass (TESTING.md §1.1), as six jobs at once: the site and mind suites
# in five parts (scripts/test-part.mjs deals the files by measured time) and the Worker's suite. Called by
# Deploy before anything goes live and by Test on every other branch with `files: quick` (all but the
# editor's software-GPU browser tests), and by Slow after a release with `files: slow` (those only; the owner,
# 2026-11-18: "better to go live and have a good recording and reporting pipeline"). `npm test` runs all of them in one go.
name: Checks
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty = the caller's)
        type: string
        default: ''
      lab:
        description: "Test's lab scope (scripts/lab-scope.mjs): empty = every suite; else the test files of a lab-only change"
        type: string
        default: ''
      files:
        description: "all, quick (all but the software-GPU tests: what a merge and a release wait for) or slow (those only: after a release)"
        type: string
        default: all
      first_only:
        description: "Test sets this: a re-run of these checks fails (TESTING.md §1 rule 8: a failing test is fixed, never retried into green)"
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    # 20 (15 until 2026-11-16, 10 until 2026-11-13): CI's machine makes the software-GPU tests about twice as slowly as
    # the measured table says, and a part that had passed for weeks ran out of time with nothing failing; on 2026-11-16
    # a part ran out at 14:59 with every test passed. A stalled test is still caught in five minutes (test-part.mjs QUIET).
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        part: [site 1/5, site 2/5, site 3/5, site 4/5, site 5/5, worker]
    steps:
      # A failing test is fixed, never retried into green (TESTING.md §1 rule 8). The rule was broken by hand three
      # times in one day (2026-11-14), each re-run hiding a test that failed again later, so on a branch a re-run
      # cannot pass: the way to green is a commit that fixes what failed. Deploy does not set this (its job re-run
      # after an outage must stay possible); the same checks passed on the branch first.
      - if: ${{ inputs.first_only && github.run_attempt > 1 }}
        run: |
          echo "::error::A re-run of the checks does not count: a failing test is fixed, not retried into green (docs/engineering/TESTING.md §1, rule 8). Push the fix."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # A lab-only change (TESTING.md §1, "Lab changes"): the site's parts run the lab's tests between them, the Worker's passes.
      - if: ${{ (inputs.lab == '' && inputs.files != 'slow') || matrix.part != 'worker' }}
        run: npm ci --ignore-scripts
      - if: ${{ matrix.part != 'worker' }}
        run: npx playwright install --with-deps --only-shell chromium
      # Switzer is fetched, not kept here (its licence forbids a public repository; scripts/fonts.mjs).
      - if: ${{ matrix.part != 'worker' }}
        run: node scripts/fonts.mjs
      # Local checks only: the live checks run after a deploy, against what went live.
      - name: Test
        env:
          PART: ${{ matrix.part }}
          SITE_URL: ''
          WORKER_URL: ''
          DRIVE_CONFIG_JSON: ''
          LAB: ${{ inputs.lab }}
          FILES: ${{ inputs.files }}
        run: |
          kind=(); if [[ "$FILES" == quick || "$FILES" == slow ]]; then kind=("--$FILES"); fi
          if [[ "$FILES" == slow && "$PART" == worker ]]; then echo "the Worker's suite has no software-GPU tests"; exit 0; fi
          if [[ -n "$LAB" ]]; then
            if [[ "$PART" == worker ]]; then echo "lab-only change: the Worker's suite is not run"; exit 0; fi
            # part 1: the types, the contract and the page budgets as preflight checks them. Then the lab's tests,
            # dealt over the five parts as the whole suite is (one part could not hold the editor's in its time)
            if [[ "$PART" == 'site 1/5' && "$FILES" != slow ]]; then npx tsc && node scripts/contract.mjs --check && node scripts/stage.mjs "$(git rev-parse HEAD)"; fi
            read -ra files <<< "$LAB"
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}" "${kind[@]}" --only "${files[@]}"
          elif [[ "$PART" == worker ]]; then
            npm run test:backend
          else
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}" "${kind[@]}"
          fi
