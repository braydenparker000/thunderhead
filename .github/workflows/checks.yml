# The checks a commit must pass (TESTING.md §1.1), as five jobs at once: the site and mind suites
# in four parts (scripts/test-part.mjs deals the files by measured time) and the Worker's suite. Called by
# Deploy before anything goes live and by Test on every other branch, so each commit is checked
# once, in about two minutes. `npm test` runs exactly the same checks in one go.
name: Checks
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty = the caller's)
        type: string
        default: ''
      lab:
        description: "Test's lab scope (scripts/lab-scope.mjs): empty = every suite; else the test files of a lab-only change"
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    # 15 (10 until 2026-11-13): CI's machine makes the software-GPU tests about twice as slowly as the measured
    # table says, and a part that had passed for weeks ran out of time with nothing failing.
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        part: [site 1/4, site 2/4, site 3/4, site 4/4, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # A lab-only change (TESTING.md §1, "Lab changes"): part site 1/4 runs the lab checks, the others pass.
      - if: ${{ inputs.lab == '' || matrix.part == 'site 1/4' }}
        run: npm ci --ignore-scripts
      - if: ${{ matrix.part != 'worker' && (inputs.lab == '' || matrix.part == 'site 1/4') }}
        run: npx playwright install --with-deps --only-shell chromium
      # Switzer is fetched, not kept here (its licence forbids a public repository; scripts/fonts.mjs).
      - if: ${{ matrix.part != 'worker' && (inputs.lab == '' || matrix.part == 'site 1/4') }}
        run: node scripts/fonts.mjs
      # Local checks only: the live checks run after a deploy, against what went live.
      - name: Test
        env:
          PART: ${{ matrix.part }}
          SITE_URL: ''
          WORKER_URL: ''
          DRIVE_CONFIG_JSON: ''
          LAB: ${{ inputs.lab }}
        run: |
          if [[ -n "$LAB" ]]; then
            if [[ "$PART" != 'site 1/4' ]]; then echo "lab-only change: part 1 runs its checks"; exit 0; fi
            # the types, the contract and the page budgets as preflight checks them, then the lab tests
            npx tsc && node scripts/contract.mjs --check && node scripts/stage.mjs "$(git rev-parse HEAD)"
            read -ra files <<< "$LAB"
            node --test "${files[@]}"
          elif [[ "$PART" == worker ]]; then
            npm run test:backend
          else
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}"
          fi
