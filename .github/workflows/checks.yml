# The checks a commit must pass (TESTING.md §1.1), as four jobs at once: the site and mind suites
# in three parts (scripts/test-part.mjs deals the files by size) and the Worker's suite. Called by
# Deploy before anything goes live and by Test on every other branch, so each commit is checked
# once, in about two minutes. `npm test` runs exactly the same checks in one go.
name: Checks
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to check (empty = the caller's)
        type: string
        default: ''
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  check:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        part: [site 1/3, site 2/3, site 3/3, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - if: ${{ matrix.part != 'worker' }}
        run: npx playwright install --with-deps --only-shell chromium
      # Switzer is fetched, not kept here (its licence forbids a public repository; scripts/fonts.mjs).
      - if: ${{ matrix.part != 'worker' }}
        run: node scripts/fonts.mjs
      # Local checks only: the live checks run after a deploy, against what went live.
      - name: Test
        env:
          PART: ${{ matrix.part }}
          SITE_URL: ''
          WORKER_URL: ''
          DRIVE_CONFIG_JSON: ''
        run: |
          if [[ "$PART" == worker ]]; then
            npm run test:backend
          else
            part="${PART#site }"
            node scripts/test-part.mjs "${part%/*}" "${part#*/}"
          fi
