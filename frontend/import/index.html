<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Bring data from the old site · Thunderhead</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script src="/ui/theme.js"></script>
<link rel="preload" href="/ui/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/forms.css">
<link rel="stylesheet" href="/ui/auth.css">
<link rel="stylesheet" href="/ui/shell.css">
<script type="module" src="/import/import.js"></script>
</head>
<body>
<div class="bg"><div class="field"></div><div class="grain"></div></div>
<main class="auth">
  <h1>Bring data from the old site</h1>
  <p>On the old site, open <b>/export/</b> and tap <b>Download export</b>. Then pick that file here. Your plays, ratings, playlists, saved songs, shows and progress come over for Music, Guitar, Podcasts, Astra and My Media.</p>
  <section class="panel">
    <div class="fld">
      <label for="file">Export file</label>
      <input id="file" name="file" type="file" accept="application/json,.json">
    </div>
    <ul class="counts" id="counts" hidden></ul>
    <button type="button" class="btn" id="go" disabled>Import</button>
    <label class="check" id="replace-row" hidden><input type="checkbox" id="replace"> Replace what's already here</label>
    <p class="line" id="line"></p>
  </section>
  <p><a class="link" href="/">Back to Home</a></p>
  <p class="sr" id="sr" role="status" aria-live="polite"></p>
</main>
</body>
</html>
