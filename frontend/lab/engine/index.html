<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engine test</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/engine/engine.css">
<script type="module" src="/lab/engine/engine.js"></script>
</head>
<body>
<main>
<h1>Engine test</h1>
<p class="lead">The engine's test bench: your RAF opened in the browser (rawler), binned to the 2576 px editing copy, and developed on the phone's graphics chip through your profiles. It shows what each step costs on this phone; the switches turn one step off, to compare.</p>
<div class="bar"><label class="pick">Open a RAF<input type="file" id="file" accept=".raf,.RAF,image/x-fuji-raf,*/*"></label>
<label class="pick quiet">Load profiles<input type="file" id="profiles" accept=".zip,application/zip"></label></div>
<div class="row"><label for="profile">Profile</label><select id="profile" disabled><option>Camera matrix</option></select><output id="kelvin"></output></div>
<div class="photo"><img id="preview" alt="The camera's own JPEG" hidden></div>
<canvas id="view" aria-label="The developed photo"></canvas>
<p class="note" id="which"></p>
<div class="row"><label for="ev">Exposure</label><input id="ev" type="range" min="-3" max="3" step="0.01" value="0"><output id="evv">0.00 EV</output></div>
<div class="row"><label for="ct">Contrast</label><input id="ct" type="range" min="0.6" max="1.6" step="0.01" value="1"><output id="ctv">1.00</output></div>
<div class="checks"><label><input id="hl" type="checkbox" checked> Rebuild blown highlights</label><label><input id="dz" type="checkbox" checked> Dither</label><label><input id="exact" type="checkbox"> Exact colour, no table (slow)</label></div>
<dl id="stats" aria-live="polite"></dl>
</main>
</body>
</html>
