<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor test · Looks</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/editor/editor.css">
<script type="module" src="/lab/editor/boot.js"></script>
</head>
<body data-board="LooksPlate">
<div id="stage"></div>
<template data-dc="LooksPlate">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; background: #000000; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 8px; z-index: 2">
    <button aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">DSCF0412</span>
      <span style="font-size: 11px; color: #a6b0bc; white-space: nowrap; font-variant-numeric: tabular-nums">23 mm · f/5.6 · 1/250 · ISO 160</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="Show histogram" aria-pressed="false" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a6b0bc" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
      <button aria-label="Undo" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #e8202a; color: #fff; font-size: 13px; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="position: absolute; top: 52px; left: 0; width: 412px; height: calc(540px - var(--cut)); overflow: hidden">
    <div onPointerDown="{{holdOn}}" onPointerUp="{{holdOff}}" onPointerCancel="{{holdOff}}" onPointerLeave="{{holdOff}}" aria-label="Photo. Press and hold to see it without the look."
         style="position: absolute; left: 20px; top: 110px; width: 372px; height: 248px; touch-action: none">
      <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block">
      <img src="/lab/editor/assets/sample.jpg" alt="The photo with the look" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: {{lookFilter}}; opacity: {{lookO}}; transition: opacity 160ms ease, filter 260ms ease">
      <div aria-hidden="true" class="grain" style="position: absolute; inset: 0; opacity: {{grainO}}"></div>
      <sc-if value="{{comparing}}" hint-placeholder-val="{{false}}"><span class="glass" style="position: absolute; left: 8px; bottom: 8px; padding: 4px 10px; border-radius: 12px; font-size: 11px">Original</span></sc-if>
    </div>

    <sc-if value="{{card}}" hint-placeholder-val="{{false}}">
      <div class="glass" role="list" aria-label="{{lookName}} settings" style="position: absolute; left: 12px; top: 12px; width: 236px; padding: 10px 10px 6px; box-sizing: border-box; border-radius: 16px; z-index: 2">
        <div style="font-size: 13px; font-weight: 600">{{lookName}}</div>
        <div style="font-size: 10px; color: #a6b0bc; margin: 2px 0 6px">{{credit}}</div>
        <sc-for list="{{params}}" as="q" hint-placeholder-count="8">
          <button role="listitem" onClick="{{q.pick}}" aria-pressed="{{q.on}}" style="width: 100%; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 7px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: {{q.bg}}">
            <span style="color: #c9d0d8">{{q.name}}</span><span style="font-weight: 600; color: {{q.ink}}; font-variant-numeric: tabular-nums">{{q.text}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <div class="glass hscroll" role="listbox" aria-label="{{collName}} looks" style="position: absolute; left: 8px; right: 8px; top: calc(432px - var(--cut)); height: 100px; border-radius: 18px; display: flex; gap: 8px; padding: 9px 10px; box-sizing: border-box">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <button role="option" aria-selected="{{t.on}}" onClick="{{t.pick}}" class="tile" style="--d: {{t.delay}}ms; animation-name: {{t.anim}}; flex: none; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span style="position: relative; width: 66px; height: 58px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 {{t.ringW}}px {{t.ring}}; background: {{t.plain}}">
            <img src="/lab/editor/assets/sample.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: 55% 50%; filter: {{t.filter}}; display: {{t.imgShow}}">
            <span style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 22px; color: #f2efe8; display: {{t.glyphShow}}">{{t.glyph}}</span>
            <span style="position: absolute; right: 4px; top: 3px; font-size: 10px; color: #e8202a; text-shadow: 0 1px 2px rgba(0,0,0,0.8)">{{t.star}}</span>
            <span style="position: absolute; left: 4px; bottom: 3px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 4px; border-radius: 4px; background: rgba(0,0,0,0.65); color: #dedbd4; display: {{t.tagShow}}">{{t.tag}}</span>
          </span>
          <span style="width: 70px; text-align: center; font-size: 9.5px; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{importing}}" hint-placeholder-val="{{false}}">
      <div class="glass" role="dialog" aria-label="Import looks" style="position: absolute; left: 12px; right: 12px; top: 60px; padding: 14px; box-sizing: border-box; border-radius: 20px; z-index: 3">
        <div style="font-size: 15px; font-weight: 600; margin-bottom: 4px">Import looks</div>
        <div style="font-size: 11px; color: #a6b0bc; margin-bottom: 10px">Lightroom presets (.xmp, .lrtemplate), LUTs (.cube), whole .zip packs, or a recipe's text.</div>
        <sc-for list="{{sources}}" as="o" hint-placeholder-count="3">
          <button onClick="{{o.pick}}" style="width: 100%; min-height: 50px; margin-bottom: 6px; padding: 8px 12px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; gap: 12px; text-align: left; background: rgba(255,255,255,0.07)">
            <span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #e8202a; font-size: 15px">{{o.glyph}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">{{o.name}}</span><span style="font-size: 10.5px; color: #a6b0bc">{{o.note}}</span></span>
          </button>
        </sc-for>
        <sc-if value="{{report}}" hint-placeholder-val="{{false}}">
          <div role="status" style="margin-top: 4px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,0.35); font-size: 11.5px; line-height: 1.5">
            <sc-for list="{{reportLines}}" as="r" hint-placeholder-count="3"><div style="color: {{r.ink}}">{{r.text}}</div></sc-for>
          </div>
        </sc-if>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; top: calc(600px - var(--cut)); width: 412px; height: 315px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
    <div role="status" aria-label="{{ctl}} {{valText}} {{unit}}" style="position: absolute; left: 20px; top: 10px; width: 372px; height: 44px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); -webkit-backdrop-filter: blur(5px) saturate(1.3); backdrop-filter: blur(5px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5)">
      <span style="position: absolute; left: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">{{ctlUp}}</span>
      <span style="position: absolute; right: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #5d6166">{{unit}}</span>
      <span style="position: absolute; left: 22px; right: 22px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5)"></span>
      <span style="position: absolute; left: 50%; top: 30px; width: 1.5px; height: 10px; margin: -5px 0 0 -0.75px; background: #6a6e73"></span>
      <span style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
      <span style="position: absolute; left: {{numX}}px; top: 30px; transform: translate(-50%, -50%); height: 20px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a, 0 2px 6px rgba(0,0,0,0.8); color: #f2efe8; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{valText}}</span>
      <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(170deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.05) 34%, rgba(255,255,255,0) 52%), radial-gradient(120% 60% at 50% 0, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%)"></span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 58px; width: 412px; height: 150px; background: url(/lab/editor/assets/dial-strip.webp) 0 {{spinY}}px / 412px 1800px no-repeat"></div>
    <div role="slider" aria-label="{{ctl}}" aria-valuemin="{{vmin}}" aria-valuemax="{{vmax}}" aria-valuenow="{{valNow}}" aria-valuetext="{{valText}} {{unit}}" tabindex="0"
         onPointerDown="{{dDown}}" onPointerMove="{{dMove}}" onPointerUp="{{dUp}}" onPointerCancel="{{dUp}}" onKeyDown="{{dKey}}"
         style="position: absolute; left: 0; top: 58px; width: 412px; height: 108px; touch-action: none; cursor: ew-resize; outline: none"></div>
    <span aria-hidden="true" style="position: absolute; left: 50%; top: 64px; margin-left: -4px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #e8202a"></span>

    <div class="hscroll" role="toolbar" aria-label="{{group}} collections" style="position: absolute; left: 0; right: 0; top: 166px; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 14px">
      <sc-for list="{{chips}}" as="p" hint-placeholder-count="7">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="eng fly" style="--dx: {{p.dx}}px; animation-name: {{p.anim}}; animation-delay: {{p.delay}}ms; flex: none; position: relative; height: 34px; padding: 0 {{p.pad}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: {{p.size}}px; font-weight: 600; letter-spacing: 0.14em; color: {{p.ink}}">{{p.name}}</span>
          <span style="font-size: 9px; letter-spacing: 0.04em; color: {{p.valueInk}}; font-variant-numeric: tabular-nums">{{p.value}}</span>
          <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: {{p.bar}}"></span>
        </button>
      </sc-for>
    </div>

    <nav aria-label="Look sources" style="position: absolute; left: 14px; right: 14px; top: 206px; height: 30px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
      <sc-for list="{{groups}}" as="s" hint-placeholder-count="4">
        <button onClick="{{s.pick}}" aria-current="{{s.current}}" class="eng" style="position: relative; height: 30px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{s.ink}}">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{s.dot}}"></span>{{s.label}}
        </button>
      </sc-for>
    </nav>

    <div style="position: absolute; left: 14px; bottom: 22px; display: flex; gap: 8px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
        <button class="key" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="height: 40px; padding: 0 16px; border-radius: 12px; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">
          <sc-if value="{{a.dot}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #e8202a; box-shadow: 0 0 6px rgba(232,32,42,0.7)"></span></sc-if>{{a.name}}
        </button>
      </sc-for>
    </div>
  </div>

  <button class="glass" aria-label="Back to the tools" style="position: absolute; right: 14px; bottom: 18px; width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; z-index: 3">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
  </button>
</div>
</template>
</body>
</html>
