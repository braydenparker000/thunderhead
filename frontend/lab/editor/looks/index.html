<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor test · Looks</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/editor/editor.css">
<script type="module" src="/lab/editor/boot.js"></script>
</head>
<body data-board="LooksPlate">
<div id="stage"></div>
<template data-dc="LooksPlate">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 8px; z-index: 2">
    <button aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">{{fileName}}</span>
      <span style="font-size: 11px; color: #a6b0bc; white-space: nowrap; font-variant-numeric: tabular-nums">{{shotLine}}</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="Show histogram" aria-pressed="false" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a6b0bc" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
      <button aria-label="Undo" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #2468d8; color: #fff; font-size: 13px; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="position: absolute; top: 52px; left: 0; right: 0; height: calc(649px - var(--cut))">
    <sc-if value="{{real}}"><div data-keep="photo" data-zoom="low" style="position: absolute; inset: 0; overflow: hidden; touch-action: none"></div></sc-if>
    <sc-if value="{{demo}}"><img src="/lab/editor/assets/sample.jpg" alt="The photo with the look" style="position: absolute; left: 20px; right: 20px; top: 50%; width: 372px; transform: translateY(-50%); filter: {{lookFilter}}; transition: filter 260ms ease"></sc-if>
    <sc-if value="{{hasStatus}}"><span role="status" style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 11px; background: rgba(0,0,0,0.6)">{{status}}</span></sc-if>
  </div>

  <div class="plate" style="position: absolute; left: 0; top: calc(705px - var(--cut)); width: 412px; height: 340px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 340px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
    <sc-if value="{{strong}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; top: 4px"><dc-import name="DialPlate" slim="{{strong}}" left="{{strong}}" label="{{dialLabel}}" unit="%" value="{{dialValue}}" text="{{dialText}}" onturn="{{dialTurn}}" onreset="{{dialReset}}" hint-size="412px,44px"></dc-import></div></sc-if>
    <sc-if value="{{plain}}"><span role="status" style="position: absolute; left: 20px; right: 20px; top: 6px; height: 40px; display: flex; align-items: center; font-size: 11.5px; line-height: 1.35; color: #8d9197">{{hint}}</span></sc-if>
    <div style="position: absolute; left: 0; top: 52px"><dc-import name="Strip" tiles="{{tiles}}" label="{{stripLabel}}" empty="{{noTiles}}" hint-size="412px,92px"></dc-import></div>
    <div style="position: absolute; left: 10px; top: 150px">
      <dc-import name="Drum" faces="{{faces}}" at="{{faceAt}}" onpick="{{pickFace}}" hint-size="80px,52px"></dc-import>
    </div>
    <div style="position: absolute; left: 94px; top: 152px"><dc-import name="Row" chips="{{chips}}" label="{{rowAria}}" seed="{{faceAt}}" hint-size="254px,48px"></dc-import></div>
    <button aria-label="Back to the tools" class="glass" style="position: absolute; right: 10px; top: 152px; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
  </div>
</div>
</template>
<template data-dc="DialPlate">
<div style="width: 412px; height: {{tall}}px; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; user-select: none">

  <div role="status" aria-label="{{label}} {{valueText}} {{unit}}" style="position: absolute; left: 20px; top: 2px; width: 372px; height: 40px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); -webkit-backdrop-filter: blur(5px) saturate(1.3); backdrop-filter: blur(5px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5)">
    <span style="position: absolute; left: 12px; top: 5px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">{{labelUp}}</span>
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <span style="position: absolute; left: {{trackL}}px; width: {{trackW}}px; top: 27px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5)"></span>
      <span style="position: absolute; left: {{midX}}px; top: 27px; width: 1.5px; height: 10px; margin: -5px 0 0 -0.75px; background: #6a6e73"></span>
      <span style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 27px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
    </div>
    <span style="position: absolute; left: {{numX}}px; top: 27px; transform: translate(-50%, -50%); height: 20px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a, 0 2px 6px rgba(0,0,0,0.8); color: #f2efe8; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{valueText}}</span>
    <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(170deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.05) 34%, rgba(255,255,255,0) 52%), radial-gradient(120% 60% at 50% 0, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%)"></span>
    <sc-if value="{{hasAuto}}" hint-placeholder-val="{{false}}">
      <button class="key" onClick="{{pressAuto}}" aria-label="{{auto}}" style="position: absolute; right: 6px; top: 7px; height: 26px; padding: 0 9px; border-radius: 8px; display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: #e8202a; box-shadow: 0 0 6px rgba(232,32,42,0.7)"></span>{{auto}}</button>
    </sc-if>
  </div>

  <sc-if value="{{wheel}}"><div aria-hidden="true" style="position: absolute; left: 0; top: 44px; width: 412px; height: 98px; overflow: hidden"><div class="wheelp" style="width: 412px; height: 150px; background-position: 0 {{offset}}px"></div></div></sc-if>
  <div role="slider" aria-label="{{label}}" aria-valuemin="-5" aria-valuemax="5" aria-valuenow="{{valueNow}}" aria-valuetext="{{valueText}} {{unit}}" tabindex="0"
       onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}"
       style="position: absolute; left: 0; top: {{hitT}}px; width: {{hitW}}px; height: {{hitH}}px; touch-action: none; cursor: ew-resize; outline: none"></div>
  <sc-if value="{{wheel}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 50px; margin-left: -4px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #e8202a"></span></sc-if>
</div>
</template>
<template data-dc="Strip">
<div class="hscroll" role="listbox" aria-label="{{label}}" style="position: relative; width: 412px; height: 92px; display: flex; gap: 8px; padding: 2px 14px 0; box-sizing: border-box; align-items: flex-start; font-family: Inter, system-ui, sans-serif">
  <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><span style="align-self: center; font-size: 11.5px; color: #80848a">{{empty}}</span></sc-if>
  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
    <button role="option" aria-selected="{{t.on}}" aria-label="{{t.name}}" onClick="{{t.pick}}" style="flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <span style="position: relative; width: 84px; height: 58px; border-radius: 9px; overflow: hidden; background: #000; box-shadow: 0 0 0 {{t.ringW}}px {{t.ring}}, 0 2px 6px rgba(0,0,0,0.6)">
        <img src="{{t.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: {{t.imgShow}}; filter: {{t.filter}}">
        <span aria-hidden="true" style="position: absolute; inset: 0; display: {{t.glyphShow}}; align-items: center; justify-content: center; font-size: 24px; color: #f2efe8; background: rgba(232,32,42,0.25)">{{t.glyph}}</span>
        <span style="position: absolute; left: 4px; top: 4px; display: {{t.tagShow}}; padding: 1px 5px; border-radius: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.1em; color: #f2efe8; background: rgba(0,0,0,0.6)">{{t.tag}}</span>
      </span>
      <span class="eng" style="max-width: 84px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
    </button>
  </sc-for>
</div>
</template>
<template data-dc="Drum">
<div role="listbox" aria-label="Sections: {{now}}" aria-orientation="vertical" tabindex="0" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}"
     style="width: 80px; height: 52px; position: relative; border-radius: 10px; overflow: hidden; touch-action: none; cursor: ns-resize; perspective: 240px; background: #0b0c0d; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), 0 1px 0 rgba(255,255,255,0.07), 0 2px 6px rgba(0,0,0,0.6); user-select: none; outline: none; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(-{{r}}px) rotateX({{angle}}deg); transition: {{ease}}">
    <sc-for list="{{faces}}" as="f" hint-placeholder-count="9">
      <span role="option" aria-selected="{{f.on}}" class="eng" style="position: absolute; left: 0; right: 0; top: 50%; height: {{fh}}px; margin-top: -{{half}}px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; transform: rotateX({{f.a}}deg) translateZ({{r}}px); background: linear-gradient(180deg, #323435, #1c1d1e); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.7); padding-left: 7px; box-sizing: border-box; font-size: {{f.size}}px; font-weight: 600; letter-spacing: {{f.gap}}em; color: {{f.ink}}">{{f.label}}<sup style="font-size: 7.5px; letter-spacing: 0; margin-left: 2px; color: {{f.countInk}}">{{f.count}}</sup></span>
    </sc-for>
  </div>
  <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.82) 0, rgba(0,0,0,0) 36%, rgba(0,0,0,0) 64%, rgba(0,0,0,0.82) 100%)"></span>
  <span aria-hidden="true" style="position: absolute; left: 3px; top: 50%; margin-top: -4px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid #e8202a"></span>
</div>
</template>
<template data-dc="Row">
<div class="hscroll" role="toolbar" aria-label="{{label}}" style="width: {{wide}}px; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 6px; box-sizing: border-box; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 16px), transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 8px, #000 calc(100% - 16px), transparent 100%)">
  <sc-for list="{{chips}}" as="p" hint-placeholder-count="7">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="eng fly" style="--dx: {{p.dx}}px; animation-name: {{p.anim}}; animation-delay: {{p.delay}}ms; flex: none; position: relative; height: 38px; padding: 0 {{p.pad}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 6px; box-shadow: {{p.box}}">
          <sc-if value="{{p.isDot}}" hint-placeholder-val="{{false}}"><span style="width: 13px; height: 13px; border-radius: 50%; background: {{p.dot}}; box-shadow: {{p.dotRing}}"></span></sc-if>
          <sc-if value="{{p.isDropper}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dedbd4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5M17 2.5l4.5 4.5-3 3-4.5-4.5z"/><path d="M15 9l-9 9-2.5.5.5-2.5 9-9"/></svg></sc-if>
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: {{p.ink}}; white-space: nowrap">{{p.name}}</span>
          <span style="font-size: 9px; letter-spacing: 0.04em; color: {{p.valueInk}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{p.value}}</span>
          <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: {{p.bar}}"></span>
        </button>
  </sc-for>
</div>
</template>
</body>
</html>
