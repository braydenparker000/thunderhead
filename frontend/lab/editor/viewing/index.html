<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor test · Viewing</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/editor/editor.css">
<script type="module" src="/lab/editor/boot.js"></script>
</head>
<body data-board="ViewTools">
<div id="stage"></div>
<template data-dc="ViewTools">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 2px; padding: 0 10px 0 8px; z-index: 3">
    <button aria-label="Back to the editor" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 600">{{fileName}}</div><div style="font-size: 11px; color: #a6b0bc">{{shotLine}}</div></div>
    <button onClick="{{tHist}}" aria-pressed="{{hist}}" aria-label="Histogram" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{histInk}}" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
    <button onClick="{{tHistory}}" aria-pressed="{{history}}" aria-label="History" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{historyInk}}" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg></button>
    <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #2468d8; color: #fff; font-size: 13px; font-weight: 600">Export</button>
  </header>

  <div onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" aria-label="{{photoAria}}"
       style="position: absolute; top: 52px; left: 0; width: 412px; height: calc({{photoH}}px - var(--cut)); overflow: hidden; touch-action: none; transition: height 320ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <sc-if value="{{real}}"><div data-keep="photo" data-zoom="top" style="position: absolute; inset: 0; overflow: hidden; touch-action: none"></div></sc-if>
    <sc-if value="{{demo}}">
    <div style="position: absolute; left: {{imL}}px; top: {{imT}}px; width: {{imW}}px; height: {{imH}}px; transition: {{imTr}}">
      <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: {{pix}}">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{afterW}}; overflow: hidden; direction: rtl; right: 0; left: auto">
        <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; right: 0; top: 0; width: {{imW}}px; height: {{imH}}px; display: block; filter: {{after}}; image-rendering: {{pix}}">
      </div>
      <sc-if value="{{clipDemo}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 12% 9% at 72% 18%, rgba(232,32,42,0.85) 60%, transparent 70%), radial-gradient(ellipse 18% 10% at 22% 88%, rgba(60,110,255,0.85) 60%, transparent 70%)"></div></sc-if>
    </div>
    </sc-if>
    <sc-if value="{{beforeOn}}"><div aria-hidden="true" style="position: absolute; left: {{imL}}px; top: {{imT}}px; width: {{beforeW}}px; height: {{imH}}px; overflow: hidden; pointer-events: none"><img src="{{beforeSrc}}" alt="" style="position: absolute; left: 0; top: 0; width: {{imW}}px; height: {{imH}}px; display: block"></div></sc-if>
    <sc-if value="{{split}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{splitX}}px; width: 2px; margin-left: -1px; background: #f2efe8; box-shadow: 0 0 6px rgba(0,0,0,0.6)">
        <span class="glass" style="position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px">⇔</span>
      </div>
      <span class="glass" style="position: absolute; left: 12px; bottom: 14px; padding: 4px 10px; border-radius: 12px; font-size: 11px">Before</span>
      <span class="glass" style="position: absolute; right: 12px; bottom: 14px; padding: 4px 10px; border-radius: 12px; font-size: 11px">After</span>
    </sc-if>
    <sc-if value="{{zoomed}}" hint-placeholder-val="{{false}}">
      <span class="glass" style="position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600">100%</span>
      <div class="glass" aria-hidden="true" style="position: absolute; right: 12px; bottom: 14px; width: {{mapW}}px; height: {{mapH}}px; border-radius: 10px; overflow: hidden; padding: 0">
        <img src="{{mapSrc}}" alt="" style="width: 100%; height: 100%; display: block; filter: {{after}}; opacity: 0.85">
        <span style="position: absolute; left: {{mmL}}%; top: {{mmT}}%; width: {{mmW}}%; height: {{mmH}}%; box-shadow: 0 0 0 1.5px #e8202a, 0 0 0 999px rgba(0,0,0,0.35)"></span>
      </div>
    </sc-if>
    <sc-if value="{{hist}}" hint-placeholder-val="{{false}}">
      <div class="glass" style="position: absolute; right: 12px; top: 12px; width: 168px; height: 92px; border-radius: 14px; padding: 0; overflow: hidden">
        <svg width="168" height="70" viewBox="0 0 168 70" aria-label="Histogram" style="position: absolute; left: 0; top: 6px">
          <path d="{{hR}}" fill="rgba(255,90,90,0.55)"/>
          <path d="{{hG}}" fill="rgba(90,220,120,0.5)" style="mix-blend-mode: screen"/>
          <path d="{{hB}}" fill="rgba(100,150,255,0.55)" style="mix-blend-mode: screen"/>
        </svg>
        <button onClick="{{tClip}}" aria-pressed="{{clip}}" aria-label="Show clipped shadows and highlights" style="position: absolute; left: 8px; right: 8px; bottom: 4px; height: 18px; display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: #c9d0d8; font-variant-numeric: tabular-nums">
          <span style="color: {{clipInk}}">▲ {{clipLo}}</span><span>{{histMeta}}</span><span style="color: {{clipInk}}">{{clipHi}} ▲</span>
        </button>
      </div>
    </sc-if>
  </div>

  <div class="plate" style="position: absolute; left: 0; top: calc({{plateTop}}px - var(--cut)); width: 412px; height: 340px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 340px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7); transition: top 320ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <nav aria-label="View" style="position: absolute; left: 8px; right: 8px; top: 12px; height: 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" class="eng" style="position: relative; height: 34px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{m.ink}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{m.dot}}"></span>{{m.label}}</button>
      </sc-for>
    </nav>
    <sc-if value="{{versions}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; top: 54px"><dc-import name="Strip" tiles="{{vers}}" label="Versions" hint-size="412px,92px"></dc-import></div></sc-if>
    <sc-if value="{{history}}" hint-placeholder-val="{{false}}">
      <div class="hscroll" role="list" aria-label="History" style="position: absolute; left: 0; right: 0; top: 54px; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; box-sizing: border-box">
        <sc-for list="{{steps}}" as="h" hint-placeholder-count="8">
          <button role="listitem" onClick="{{h.pick}}" aria-current="{{h.cur}}" style="flex: none; height: 38px; padding: 0 11px; border-radius: 10px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; background: {{h.bg}}; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09); opacity: {{h.o}}">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; white-space: nowrap"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: {{h.dot}}"></span>{{h.name}}</span>
            <span style="font-size: 9.5px; color: #a6b0bc; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 11px">{{h.val}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <div style="position: absolute; left: 14px; right: 74px; top: {{hintTop}}px; height: 48px; display: flex; align-items: center; font-size: 10.5px; line-height: 1.45; color: #8b8f95">{{hint}}</div>
    <button aria-label="Back to the tools" class="glass" style="position: absolute; right: 10px; top: {{hintTop}}px; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
  </div>
</div>
</template>
<template data-dc="Strip">
<div class="hscroll" role="listbox" aria-label="{{label}}" style="position: relative; width: 412px; height: 92px; display: flex; gap: 8px; padding: 2px 14px 0; box-sizing: border-box; align-items: flex-start; font-family: Inter, system-ui, sans-serif">
  <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><span style="align-self: center; font-size: 11.5px; color: #80848a">{{empty}}</span></sc-if>
  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
    <button role="option" aria-selected="{{t.on}}" aria-label="{{t.name}}" onClick="{{t.pick}}" style="flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <span style="position: relative; width: 84px; height: 58px; border-radius: 9px; overflow: hidden; background: #000; box-shadow: 0 0 0 {{t.ringW}}px {{t.ring}}, 0 2px 6px rgba(0,0,0,0.6)">
        <img src="{{t.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: {{t.imgShow}}; filter: {{t.filter}}">
        <span aria-hidden="true" style="position: absolute; inset: 0; display: {{t.glyphShow}}; align-items: center; justify-content: center; font-size: 24px; color: #f2efe8; background: rgba(232,32,42,0.25)">{{t.glyph}}</span>
        <span style="position: absolute; left: 4px; top: 4px; display: {{t.tagShow}}; padding: 1px 5px; border-radius: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.1em; color: #f2efe8; background: rgba(0,0,0,0.6)">{{t.tag}}</span>
      </span>
      <span class="eng" style="max-width: 84px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
    </button>
  </sc-for>
</div>
</template>
</body>
</html>
