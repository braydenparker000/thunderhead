<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor test</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/editor/editor.css">
<script type="module" src="/lab/editor/boot.js"></script>
</head>
<body data-board="App">
<div id="frame"><div id="stage"></div>
<div id="dockveil" hidden></div>
<nav id="dock" class="glass" aria-label="Tools" hidden><button type="button" data-go="Looks" aria-label="Looks"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="10" r="5.5"/><circle cx="15" cy="10" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg></span><span>Looks</span></button><button type="button" data-go="Crop" aria-label="Crop"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg></span><span>Crop</span></button><button type="button" data-go="Edit" aria-label="Edit"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span><span>Edit</span></button><button type="button" data-go="Masks" aria-label="Masks"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor" stroke="none"/></svg></span><span>Masks</span></button><button type="button" data-go="Heal" aria-label="Heal"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span><span>Heal</span></button><button type="button" data-go="Versions" aria-label="Versions"><span class="lens" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M7 5h10M9.5 2.5h5"/></svg></span><span>Versions</span></button></nav>
</div>
<template data-dc="EditPlate">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; background: #000000; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 8px; z-index: 2">
    <button aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">{{fileName}}</span>
      <span style="font-size: 11px; color: #a6b0bc; white-space: nowrap; font-variant-numeric: tabular-nums">{{shotLine}}</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="Show histogram" aria-pressed="false" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a6b0bc" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
      <button aria-label="Undo" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #2468d8; color: #fff; font-size: 13px; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="position: absolute; top: 52px; left: 0; right: 0; height: calc({{photoH}}px - var(--cut)); display: flex; align-items: center; justify-content: center; transition: height 480ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <div data-keep="photo" data-zoom="low" style="position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none"></div>
    <sc-if value="{{hasStatus}}"><span role="status" style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 11px; background: rgba(0,0,0,0.6)">{{status}}</span></sc-if>
    <span style="position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 11px; background: rgba(0,0,0,0.6); font-variant-numeric: tabular-nums">{{countText}}</span>
  </div>

  <sc-if value="{{showCurve}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 56px; top: calc(172px - var(--cut) / 2); z-index: 1">
      <dc-import name="CurveOverlay" channel="{{chan}}" hint-size="300px,300px"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{showTrio}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 12px; top: calc(432px - var(--cut)); z-index: 1">
      <dc-import name="GradeTrio" zone="{{zone}}" hint-size="388px,150px"></dc-import>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; top: calc(600px - var(--cut)); width: 412px; height: 315px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7); transform: translateY({{plateY}}); transition: transform 520ms cubic-bezier(0.2, 0.85, 0.2, 1); pointer-events: {{panelEvents}}">

    <div class="hscroll" role="toolbar" aria-label="{{rowAria}}" style="position: absolute; z-index: 1; left: 0; right: 0; top: 166px; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 14px">
      <sc-if value="{{inSub}}" hint-placeholder-val="{{false}}">
        <button onClick="{{backSub}}" aria-label="Back to {{section}}" class="eng" style="flex: none; height: 30px; padding: 0 8px 0 2px; font-size: 15px; color: #c9ccd1">‹</button>
      </sc-if>
      <sc-for list="{{chips}}" as="p" hint-placeholder-count="7">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="eng fly" style="--dx: {{p.dx}}px; animation-name: {{p.anim}}; animation-delay: {{p.delay}}ms; flex: none; position: relative; height: 34px; padding: 0 {{p.pad}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 6px; box-shadow: {{p.box}}">
          <sc-if value="{{p.isDot}}" hint-placeholder-val="{{false}}"><span style="width: 13px; height: 13px; border-radius: 50%; background: {{p.dot}}; box-shadow: {{p.dotRing}}"></span></sc-if>
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: {{p.ink}}">{{p.name}}</span>
          <span style="font-size: 9px; letter-spacing: 0.04em; color: {{p.valueInk}}; font-variant-numeric: tabular-nums">{{p.value}}</span>
          <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: {{p.bar}}"></span>
        </button>
      </sc-for>
    </div>

    <div style="position: absolute; left: 0; top: 8px">
      <dc-import name="DialPlate" label="{{dialLabel}}" unit="{{unit}}" value="{{dialValue}}" text="{{dialText}}" onturn="{{dialTurn}}" hint-size="412px,200px"></dc-import>
    </div>

    <nav aria-label="Edit sections" style="position: absolute; left: 14px; right: 14px; top: 206px; height: 30px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
      <sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
        <button onClick="{{s.pick}}" aria-current="{{s.current}}" class="eng" style="position: relative; height: 30px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{s.ink}}">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{s.dot}}"></span>
          {{s.label}}<sup style="font-size: 7.5px; letter-spacing: 0; margin-left: 2px; color: {{s.countInk}}">{{s.count}}</sup>
        </button>
      </sc-for>
    </nav>

    <div style="position: absolute; left: 14px; bottom: 22px; display: flex; gap: 8px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
        <button class="key" onClick="{{a.pick}}" aria-label="{{a.aria}}" aria-expanded="{{a.expanded}}" style="height: 40px; padding: 0 {{a.pad}}px; border-radius: 12px; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">
          <sc-if value="{{a.auto}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #e8202a; box-shadow: 0 0 6px rgba(232,32,42,0.7)"></span></sc-if>
          <sc-if value="{{a.dropper}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dedbd4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5M17 2.5l4.5 4.5-3 3-4.5-4.5z"/><path d="M15 9l-9 9-2.5.5.5-2.5 9-9"/></svg></sc-if>
          {{a.name}}
          <sc-if value="{{a.caret}}" hint-placeholder-val="{{false}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8b8f95" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{wbMenu}}" hint-placeholder-val="{{false}}">
    <div class="glass" role="menu" aria-label="White balance" style="position: absolute; left: 14px; bottom: 70px; width: 200px; padding: 6px; box-sizing: border-box; border-radius: 18px; z-index: 4">
      <sc-for list="{{wbList}}" as="w" hint-placeholder-count="8">
        <button role="menuitemradio" aria-checked="{{w.on}}" onClick="{{w.pick}}" style="width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; background: {{w.bg}}">
          <span>{{w.name}}</span><span style="font-size: 11px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{w.k}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <nav aria-label="Tools" class="glass" style="position: absolute; bottom: 18px; left: {{dockLeft}}px; width: {{dockW}}px; height: {{dockH}}px; border-radius: 32px; overflow: hidden; z-index: 3; transition: left 480ms cubic-bezier(0.2, 0.85, 0.2, 1), width 480ms cubic-bezier(0.2, 0.85, 0.2, 1), height 480ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <div style="position: absolute; left: 0; top: 0; width: 384px; height: 64px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 6px; box-sizing: border-box; opacity: {{toolsOpacity}}; transition: opacity 220ms ease; pointer-events: {{toolsEvents}}">
      <sc-for list="{{tools}}" as="t" hint-placeholder-count="6">
        <button aria-label="{{t.name}}" onClick="{{t.open}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #eceff4">
          <span class="{{t.lens}}" style="width: 44px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center" aria-hidden="true">
            <sc-if value="{{t.isLooks}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="10" r="5.5"/><circle cx="15" cy="10" r="5.5"/><circle cx="12" cy="15" r="5.5"/></svg></sc-if>
            <sc-if value="{{t.isCrop}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg></sc-if>
            <sc-if value="{{t.isEdit}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></sc-if>
            <sc-if value="{{t.isMasks}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 010 17z" fill="currentColor" stroke="none"/></svg></sc-if>
            <sc-if value="{{t.isHeal}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="2.5" y="8.5" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></sc-if>
            <sc-if value="{{t.isVersions}}" hint-placeholder-val="{{false}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M7 5h10M9.5 2.5h5"/></svg></sc-if>
          </span>
          <span style="font-size: 10px; font-weight: 500; color: #dfe4ea">{{t.name}}</span>
        </button>
      </sc-for>
    </div>
    <button aria-label="Back to the tools" onClick="{{close}}" style="position: absolute; right: 0; top: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; opacity: {{backOpacity}}; transition: opacity 260ms ease 200ms; pointer-events: {{panelEvents}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
    </button>
  </nav>

  <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
    <span style="position: absolute; left: 0; right: 0; bottom: 96px; text-align: center; font-size: 12px; color: #77828f">Tap Edit to open the section</span>
  </sc-if>
</div>
</template>
<template data-dc="CurveOverlay">
<div onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" role="group" aria-label="Tone curve, {{channel}} channel. Drag a point; tap the line to add one."
     style="width: 300px; height: 300px; position: relative; border-radius: 18px; overflow: hidden; touch-action: none; background: rgba(8,9,11,0.55); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 18px 40px rgba(0,0,0,0.5); font-family: Inter, system-ui, sans-serif">
  <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0" aria-hidden="true">
    <path d="{{hill}}" fill="rgba(255,255,255,0.07)"/>
    <path d="M14 105.3H286M14 196.7H286M105.3 14V286M196.7 14V286" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M14 286L286 14" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="{{path}}" fill="none" stroke="{{ink}}" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <sc-for list="{{dots}}" as="p" hint-placeholder-count="4">
    <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; background: {{p.bg}}; box-shadow: 0 0 0 2px {{p.ring}}, 0 2px 6px rgba(0,0,0,0.6)"></span>
  </sc-for>
  <span style="position: absolute; left: 14px; top: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: {{ink}}">{{chanUp}}</span>
  <span style="position: absolute; right: 14px; top: 10px; font-size: 10px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{readout}}</span>
</div>
</template>
<template data-dc="GradeTrio">
<div style="width: 388px; height: 150px; position: relative; border-radius: 22px; background: rgba(8,9,11,0.55); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 18px 40px rgba(0,0,0,0.5); font-family: Inter, system-ui, sans-serif; color: #eceff4">
  <sc-for list="{{wheels}}" as="w" hint-placeholder-count="4">
    <div style="position: absolute; left: {{w.x}}px; top: {{w.y}}px; width: {{w.d}}px">
      <div class="gw" role="slider" aria-label="{{w.name}} hue and saturation" aria-valuetext="Hue {{w.hue}} degrees, saturation {{w.sat}}" tabindex="0"
           onPointerDown="{{w.down}}" onPointerMove="{{w.move}}" onPointerUp="{{w.up}}" onPointerCancel="{{w.up}}"
           style="position: relative; width: {{w.d}}px; height: {{w.d}}px; border-radius: 50%; touch-action: none; cursor: crosshair; outline: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), inset 0 0 12px rgba(0,0,0,0.45), 0 0 0 {{w.ringW}}px {{w.ring}}; opacity: {{w.dim}}; transition: opacity 200ms ease, box-shadow 200ms ease">
        <span aria-hidden="true" style="position: absolute; left: {{w.px}}px; top: {{w.py}}px; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: {{w.puck}}; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,0.7)"></span>
      </div>
      <div style="margin-top: 6px; text-align: center; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; color: {{w.ink}}; white-space: nowrap">{{w.label}}</div>
      <div style="margin-top: 2px; text-align: center; font-size: 9px; color: #8b95a1; font-variant-numeric: tabular-nums; white-space: nowrap">{{w.hue}}° · {{w.sat}}</div>
    </div>
  </sc-for>
</div>
</template>
<template data-dc="DialPlate">
<div style="width: 412px; height: 200px; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; user-select: none">

  <div role="status" aria-label="{{label}} {{valueText}} {{unit}}" style="position: absolute; left: 20px; top: 2px; width: 372px; height: 44px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); -webkit-backdrop-filter: blur(5px) saturate(1.3); backdrop-filter: blur(5px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5)">
    <span style="position: absolute; left: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">{{labelUp}}</span>
    <span style="position: absolute; right: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #5d6166">{{unit}}</span>
    <div aria-hidden="true" style="position: absolute; inset: 0; opacity: {{trackO}}; ">
      <span style="position: absolute; left: 22px; right: 22px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5)"></span>
      <span style="position: absolute; left: 50%; top: 30px; width: 1.5px; height: 10px; margin: -5px 0 0 -0.75px; background: #6a6e73"></span>
      <span style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
    </div>
    <span style="position: absolute; left: {{numX}}px; top: {{numY}}px; transform: translate(-50%, -50%); height: 20px; padding: 0 {{numPad}}px; border-radius: 10px; display: flex; align-items: center; background: {{numBg}}; box-shadow: {{numRing}}; color: #f2efe8; font-size: {{numSize}}px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{valueText}}</span>
    <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(170deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.05) 34%, rgba(255,255,255,0) 52%), radial-gradient(120% 60% at 50% 0, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%)"></span>
  </div>

  <div class="wheelp" aria-hidden="true" style="position: absolute; left: 0; top: 50px; width: 412px; height: 150px; background-position: 0 {{offset}}px"></div>
  <div role="slider" aria-label="{{label}}" aria-valuemin="-5" aria-valuemax="5" aria-valuenow="{{valueNow}}" aria-valuetext="{{valueText}} {{unit}}" tabindex="0"
       onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}"
       style="position: absolute; left: 0; top: 50px; width: 412px; height: 112px; touch-action: none; cursor: ew-resize; outline: none"></div>

      <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: {{pix}}">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{afterW}}; overflow: hidden; direction: rtl; right: 0; left: auto">
        <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; right: 0; top: 0; width: {{imW}}px; height: {{imH}}px; display: block; filter: {{after}}; image-rendering: {{pix}}">
      </div>
      <sc-if value="{{clipDemo}}" hint-placeholder-val="{{false}}"><div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 12% 9% at 72% 18%, rgba(232,32,42,0.85) 60%, transparent 70%), radial-gradient(ellipse 18% 10% at 22% 88%, rgba(60,110,255,0.85) 60%, transparent 70%)"></div></sc-if>
    </div>
    </sc-if>
    <sc-if value="{{beforeOn}}"><div aria-hidden="true" style="position: absolute; left: {{imL}}px; top: {{imT}}px; width: {{beforeW}}px; height: {{imH}}px; overflow: hidden; pointer-events: none"><img src="{{beforeSrc}}" alt="" style="position: absolute; left: 0; top: 0; width: {{imW}}px; height: {{imH}}px; display: block"></div></sc-if>
    <sc-if value="{{split}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: {{splitX}}px; width: 2px; margin-left: -1px; background: #f2efe8; box-shadow: 0 0 6px rgba(0,0,0,0.6)">
        <span class="glass" style="position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px">⇔</span>
      </div>
      <span class="glass" style="position: absolute; left: 12px; bottom: 14px; padding: 4px 10px; border-radius: 12px; font-size: 11px">Before</span>
      <span class="glass" style="position: absolute; right: 12px; bottom: 14px; padding: 4px 10px; border-radius: 12px; font-size: 11px">After</span>
    </sc-if>
    <sc-if value="{{zoomed}}" hint-placeholder-val="{{false}}">
      <span class="glass" style="position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600">100%</span>
      <div class="glass" aria-hidden="true" style="position: absolute; right: 12px; bottom: 14px; width: {{mapW}}px; height: {{mapH}}px; border-radius: 10px; overflow: hidden; padding: 0">
        <img src="{{mapSrc}}" alt="" style="width: 100%; height: 100%; display: block; filter: {{after}}; opacity: 0.85">
        <span style="position: absolute; left: {{mmL}}%; top: {{mmT}}%; width: {{mmW}}%; height: {{mmH}}%; box-shadow: 0 0 0 1.5px #e8202a, 0 0 0 999px rgba(0,0,0,0.35)"></span>
      </div>
    </sc-if>
    <sc-if value="{{hist}}" hint-placeholder-val="{{false}}">
      <div class="glass" style="position: absolute; right: 12px; top: 12px; width: 168px; height: 92px; border-radius: 14px; padding: 0; overflow: hidden">
        <svg width="168" height="70" viewBox="0 0 168 70" aria-label="Histogram" style="position: absolute; left: 0; top: 6px">
          <path d="{{hR}}" fill="rgba(255,90,90,0.55)"/>
          <path d="{{hG}}" fill="rgba(90,220,120,0.5)" style="mix-blend-mode: screen"/>
          <path d="{{hB}}" fill="rgba(100,150,255,0.55)" style="mix-blend-mode: screen"/>
        </svg>
        <button onClick="{{tClip}}" aria-pressed="{{clip}}" aria-label="Show clipped shadows and highlights" style="position: absolute; left: 8px; right: 8px; bottom: 4px; height: 18px; display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: #c9d0d8; font-variant-numeric: tabular-nums">
          <span style="color: {{clipInk}}">▲ {{clipLo}}</span><span>{{histMeta}}</span><span style="color: {{clipInk}}">{{clipHi}} ▲</span>
        </button>
      </div>
    </sc-if>
    <sc-if value="{{history}}" hint-placeholder-val="{{false}}">
      <div class="glass" role="list" aria-label="History" style="position: absolute; left: 12px; top: 12px; width: 230px; padding: 6px; box-sizing: border-box; border-radius: 16px; z-index: 2">
        <sc-for list="{{steps}}" as="h" hint-placeholder-count="8">
          <button role="listitem" onClick="{{h.pick}}" aria-current="{{h.cur}}" style="width: 100%; height: 30px; padding: 0 8px; box-sizing: border-box; border-radius: 9px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 12px; background: {{h.bg}}; opacity: {{h.o}}">
            <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{h.dot}}"></span><span style="flex: 1">{{h.name}}</span><span style="font-size: 10.5px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{h.val}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{versions}}" hint-placeholder-val="{{false}}">
      <div class="glass hscroll" role="listbox" aria-label="Versions" style="position: absolute; left: 8px; right: 8px; bottom: 12px; height: 104px; border-radius: 18px; display: flex; gap: 10px; padding: 10px; box-sizing: border-box; z-index: 2">
        <sc-for list="{{vers}}" as="v" hint-placeholder-count="4">
          <button role="option" aria-selected="{{v.on}}" onClick="{{v.pick}}" style="flex: none; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 5px">
            <span style="position: relative; width: 76px; height: 60px; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 {{v.ringW}}px {{v.ring}}; background: rgba(232,32,42,0.2)">
              <img src="{{v.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: {{v.filter}}; display: {{v.imgShow}}">
              <span style="position: absolute; inset: 0; display: {{v.plusShow}}; align-items: center; justify-content: center; font-size: 24px">+</span>
            </span>
            <span style="font-size: 10px; color: {{v.ink}}; white-space: nowrap">{{v.name}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 0; top: calc(790px - var(--cut)); width: 412px; height: 125px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
    <nav aria-label="View" style="position: absolute; left: 8px; right: 8px; top: 12px; height: 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
        <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" class="eng" style="position: relative; height: 34px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{m.ink}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{m.dot}}"></span>{{m.label}}</button>
      </sc-for>
    </nav>
    <div style="position: absolute; left: 14px; right: 84px; bottom: 22px; font-size: 10.5px; line-height: 1.45; color: #8b8f95">{{hint}}</div>
  </div>
  <button class="glass" aria-label="Back to the tools" style="position: absolute; right: 14px; bottom: 18px; width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; z-index: 3"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
</div>
</template>
<template data-dc="HealPlate">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; background: #000000; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 8px; z-index: 2">
    <button aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">{{fileName}}</span>
      <span style="font-size: 11px; color: #a6b0bc; white-space: nowrap; font-variant-numeric: tabular-nums">{{shotLine}}</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="Show histogram" aria-pressed="false" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a6b0bc" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
      <button aria-label="Undo" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #e8202a; color: #fff; font-size: 13px; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="position: absolute; top: 52px; left: 0; width: 412px; height: calc(540px - var(--cut)); overflow: hidden">
    <sc-if value="{{real}}"><div data-keep="photo" data-zoom="tool" style="position: absolute; inset: 0; overflow: hidden; touch-action: none; filter: {{viz}}"></div></sc-if>
    <div data-zoom-with onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" aria-label="Photo. Tap a spot to {{toolVerb}} it."
         style="position: absolute; left: {{pL}}px; top: {{pT}}px; width: {{pW}}px; height: {{pH}}px; touch-action: none; cursor: crosshair; transform: {{zoomT}}; transform-origin: 0 0">
      <sc-if value="{{demo}}"><img src="/lab/editor/assets/sample.jpg" alt="The photo being retouched" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; filter: {{viz}}"></sc-if>
      <sc-for list="{{patches}}" as="p" hint-placeholder-count="0">
        <span aria-hidden="true" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; overflow: hidden; -webkit-mask-image: radial-gradient(circle, #000 {{p.hard}}%, transparent 72%); mask-image: radial-gradient(circle, #000 {{p.hard}}%, transparent 72%); opacity: {{p.o}}">
          <img src="/lab/editor/assets/sample.jpg" alt="" style="position: absolute; left: {{p.il}}px; top: {{p.it}}px; width: 372px; height: 248px; max-width: none; filter: {{viz}}">
        </span>
      </sc-for>
      <sc-for list="{{rings}}" as="r" hint-placeholder-count="0">
        <svg aria-hidden="true" width="372" height="248" style="position: absolute; inset: 0; pointer-events: none; overflow: visible">
          <line x1="{{r.x}}" y1="{{r.y}}" x2="{{r.sx}}" y2="{{r.sy}}" stroke="rgba(255,255,255,{{r.a}})" stroke-width="{{r.thin}}" stroke-dasharray="{{r.d1}}"/>
          <circle cx="{{r.x}}" cy="{{r.y}}" r="{{r.r}}" fill="none" stroke="{{r.ink}}" stroke-width="{{r.w}}"/>
          <circle cx="{{r.sx}}" cy="{{r.sy}}" r="{{r.r}}" fill="none" stroke="rgba(255,255,255,{{r.a}})" stroke-width="{{r.thin}}" stroke-dasharray="{{r.d2}}"/>
        </svg>
      </sc-for>
    </div>
    <span class="glass" style="position: absolute; left: 12px; top: 12px; padding: 5px 10px; border-radius: 12px; font-size: 11px">{{status}}</span>
  </div>

  <div style="position: absolute; left: 0; top: calc(600px - var(--cut)); width: 412px; height: 315px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
    <div role="status" aria-label="{{ctl}} {{valText}} {{unit}}" style="position: absolute; left: 20px; top: 10px; width: 372px; height: 44px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); -webkit-backdrop-filter: blur(5px) saturate(1.3); backdrop-filter: blur(5px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5)">
      <span style="position: absolute; left: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">{{ctlUp}}</span>
      <span style="position: absolute; right: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #5d6166">{{unit}}</span>
      <span style="position: absolute; left: 22px; right: 22px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5)"></span>
      <span style="position: absolute; left: 50%; top: 30px; width: 1.5px; height: 10px; margin: -5px 0 0 -0.75px; background: #6a6e73"></span>
      <span style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
      <span style="position: absolute; left: {{numX}}px; top: 30px; transform: translate(-50%, -50%); height: 20px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a, 0 2px 6px rgba(0,0,0,0.8); color: #f2efe8; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{valText}}</span>
      <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(170deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.05) 34%, rgba(255,255,255,0) 52%), radial-gradient(120% 60% at 50% 0, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%)"></span>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; top: 58px; width: 412px; height: 150px; background: url(/lab/editor/assets/dial-strip.webp) 0 {{spinY}}px / 412px 1800px no-repeat"></div>
    <div role="slider" aria-label="{{ctl}}" aria-valuemin="{{vmin}}" aria-valuemax="{{vmax}}" aria-valuenow="{{valNow}}" aria-valuetext="{{valText}} {{unit}}" tabindex="0"
         onPointerDown="{{dDown}}" onPointerMove="{{dMove}}" onPointerUp="{{dUp}}" onPointerCancel="{{dUp}}" onKeyDown="{{dKey}}"
         style="position: absolute; left: 0; top: 58px; width: 412px; height: 108px; touch-action: none; cursor: ew-resize; outline: none"></div>
    <span aria-hidden="true" style="position: absolute; left: 50%; top: 64px; margin-left: -4px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #e8202a"></span>

    <div class="hscroll" role="toolbar" aria-label="{{group}} options" style="position: absolute; left: 0; right: 0; top: 166px; height: 36px; display: flex; align-items: center; gap: 4px; padding: 0 14px">
      <sc-for list="{{chips}}" as="p" hint-placeholder-count="7">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="eng fly" style="--dx: {{p.dx}}px; animation-name: {{p.anim}}; animation-delay: {{p.delay}}ms; flex: none; position: relative; height: 34px; padding: 0 {{p.pad}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: {{p.size}}px; font-weight: 600; letter-spacing: 0.14em; color: {{p.ink}}">{{p.name}}</span>
          <span style="font-size: 9px; letter-spacing: 0.04em; color: {{p.valueInk}}; font-variant-numeric: tabular-nums">{{p.value}}</span>
          <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: {{p.bar}}"></span>
        </button>
      </sc-for>
    </div>

    <nav aria-label="Retouch tool" style="position: absolute; left: 14px; right: 14px; top: 206px; height: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
      <sc-for list="{{groups}}" as="s" hint-placeholder-count="4">
        <button onClick="{{s.pick}}" aria-current="{{s.current}}" class="eng" style="position: relative; height: 30px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{s.ink}}">
          <span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{s.dot}}"></span>{{s.label}}
        </button>
      </sc-for>
    </nav>

    <div style="position: absolute; left: 14px; bottom: 22px; display: flex; gap: 8px">
      <button class="key" onClick="{{auto}}" style="height: 40px; padding: 0 16px; border-radius: 12px; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">UNDO SPOT</button>
      <button class="key" onClick="{{reset}}" style="height: 40px; padding: 0 16px; border-radius: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">CLEAR ALL</button>
    </div>
  </div>

  <button class="glass" aria-label="Back to the tools" style="position: absolute; right: 14px; bottom: 18px; width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; z-index: 3">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg>
  </button>
</div>
</template>
</body>
</html>
