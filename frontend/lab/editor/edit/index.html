<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor test · Edit</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/lab/editor/editor.css">
<script type="module" src="/lab/editor/boot.js"></script>
</head>
<body data-board="EditPlate">
<div id="stage"></div>
<template data-dc="EditPlate">
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 52px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 0 8px; z-index: 2">
    <button aria-label="Back to Photos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-size: 14px; font-weight: 600">{{fileName}}</span>
      <span style="font-size: 11px; color: #a6b0bc; white-space: nowrap; font-variant-numeric: tabular-nums">{{shotLine}}</span>
    </div>
    <div style="display: flex; align-items: center">
      <button aria-label="Show histogram" aria-pressed="false" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a6b0bc" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M4 20V14l3-5 3 6 3-9 3 7 2-3 2 4v6"/></svg></button>
      <button aria-label="Undo" style="width: 40px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button style="height: 32px; padding: 0 13px; margin-left: 4px; border-radius: 16px; background: #2468d8; color: #fff; font-size: 13px; font-weight: 600">Export</button>
    </div>
  </header>

  <div style="position: absolute; top: 52px; left: 0; right: 0; height: calc({{photoH}}px - var(--cut)); transition: height 320ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <div data-keep="photo" data-zoom="low" style="position: absolute; inset: 0; overflow: hidden; touch-action: none"></div>
    <sc-if value="{{hasStatus}}"><span role="status" style="position: absolute; top: 10px; left: 10px; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 11px; background: rgba(0,0,0,0.6)">{{status}}</span></sc-if>
  </div>

  <div class="plate" style="position: absolute; left: 0; top: calc({{plateTop}}px - var(--cut)); width: 412px; height: 340px; background: #232525 url(/lab/editor/assets/plate.webp) 0 0 / 412px 340px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7); transition: top 320ms cubic-bezier(0.2, 0.85, 0.2, 1)">
    <sc-if value="{{isDial}}"><div style="position: absolute; left: 0; top: 4px">
      <dc-import name="DialPlate" label="{{dialLabel}}" unit="{{unit}}" value="{{dialValue}}" text="{{dialText}}" onturn="{{dialTurn}}" onreset="{{dialReset}}" auto="{{auto}}" onauto="{{pressAuto}}" left="{{dialLeft}}" hint-size="412px,144px"></dc-import>
    </div></sc-if>
    <sc-if value="{{isTiles}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 0; top: 4px"><dc-import name="DialPlate" slim="{{isTiles}}" left="{{isTiles}}" label="{{dialLabel}}" unit="{{unit}}" value="{{dialValue}}" text="{{dialText}}" onturn="{{dialTurn}}" onreset="{{dialReset}}" hint-size="412px,44px"></dc-import></div>
      <div style="position: absolute; left: 0; top: 52px"><dc-import name="Strip" tiles="{{tiles}}" label="Profiles" empty="{{noTiles}}" hint-size="412px,92px"></dc-import></div>
    </sc-if>
    <sc-if value="{{isWheel}}" hint-placeholder-val="{{false}}"><div style="position: absolute; left: 0; top: 6px">
      <dc-import name="GradeWheel" zone="{{zone}}" onzone="{{pickZone}}" hint-size="412px,196px"></dc-import>
    </div></sc-if>
    <sc-if value="{{isCurve}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 14px; top: 10px; width: 264px; height: 264px"><div style="transform: scale(0.88); transform-origin: 0 0">
        <dc-import name="CurveOverlay" channel="{{chan}}" hint-size="300px,300px"></dc-import>
      </div></div>
      <div style="position: absolute; left: 290px; top: 10px; width: 108px; height: 264px; display: flex; flex-direction: column; gap: 8px">
        <div role="status" style="height: 64px; border-radius: 10px; padding: 9px 12px; box-sizing: border-box; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55); display: flex; flex-direction: column; justify-content: space-between">
          <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">IN</span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #c9ccd1">{{curveIn}}</span></span>
          <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">OUT</span><span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: #f2efe8">{{curveOut}}</span></span>
        </div>
        <button class="key" aria-label="Lift the point" onPointerDown="{{nudgeUp}}" onPointerUp="{{nudgeStop}}" onPointerCancel="{{nudgeStop}}" onPointerLeave="{{nudgeStop}}" style="flex: 1; border-radius: 12px; font-size: 18px; color: #dedbd4; touch-action: none">▲</button>
        <button class="key" aria-label="Lower the point" onPointerDown="{{nudgeDown}}" onPointerUp="{{nudgeStop}}" onPointerCancel="{{nudgeStop}}" onPointerLeave="{{nudgeStop}}" style="flex: 1; border-radius: 12px; font-size: 18px; color: #dedbd4; touch-action: none">▼</button>
        <button class="key" aria-label="Remove the point" onClick="{{removePoint}}" style="height: 40px; border-radius: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: {{removeInk}}">REMOVE</button>
      </div>
    </sc-if>
    <div style="position: absolute; left: 10px; top: {{drumTop}}px">
      <dc-import name="Drum" faces="{{faces}}" at="{{faceAt}}" onpick="{{pickFace}}" hint-size="80px,52px"></dc-import>
    </div>
    <div style="position: absolute; left: 94px; top: {{rowTop}}px"><dc-import name="Row" chips="{{chips}}" label="{{rowAria}}" seed="{{faceAt}}" hint-size="254px,48px"></dc-import></div>
    <button aria-label="Back to the tools" class="glass" style="position: absolute; right: 10px; top: {{rowTop}}px; width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#eceff4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
  </div>

  <sc-if value="{{wbMenu}}" hint-placeholder-val="{{false}}">
    <div class="glass" role="menu" aria-label="White balance" style="position: absolute; left: 14px; bottom: 76px; width: 200px; padding: 6px; box-sizing: border-box; border-radius: 18px; z-index: 4">
      <sc-for list="{{wbList}}" as="w" hint-placeholder-count="8">
        <button role="menuitemradio" aria-checked="{{w.on}}" onClick="{{w.pick}}" style="width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; background: {{w.bg}}">
          <span>{{w.name}}</span><span style="font-size: 11px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{w.k}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</template>
<template data-dc="DialPlate">
<div style="width: 412px; height: {{tall}}px; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; user-select: none">

  <div role="status" aria-label="{{label}} {{valueText}} {{unit}}" style="position: absolute; left: 20px; top: 2px; width: 372px; height: 40px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); -webkit-backdrop-filter: blur(5px) saturate(1.3); backdrop-filter: blur(5px) saturate(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5)">
    <span style="position: absolute; left: 12px; top: 5px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">{{labelUp}}</span>
    <div aria-hidden="true" style="position: absolute; inset: 0">
      <span style="position: absolute; left: {{trackL}}px; width: {{trackW}}px; top: 27px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5)"></span>
      <span style="position: absolute; left: {{midX}}px; top: 27px; width: 1.5px; height: 10px; margin: -5px 0 0 -0.75px; background: #6a6e73"></span>
      <span style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 27px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
    </div>
    <span style="position: absolute; left: {{numX}}px; top: 27px; transform: translate(-50%, -50%); height: 20px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a, 0 2px 6px rgba(0,0,0,0.8); color: #f2efe8; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{valueText}}</span>
    <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(170deg, rgba(255,255,255,0.16) 0, rgba(255,255,255,0.05) 34%, rgba(255,255,255,0) 52%), radial-gradient(120% 60% at 50% 0, rgba(255,255,255,0.08), rgba(255,255,255,0) 70%)"></span>
    <sc-if value="{{hasAuto}}" hint-placeholder-val="{{false}}">
      <button class="key" onClick="{{pressAuto}}" aria-label="{{auto}}" style="position: absolute; right: 6px; top: 7px; height: 26px; padding: 0 9px; border-radius: 8px; display: flex; align-items: center; gap: 5px; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4"><span aria-hidden="true" style="width: 5px; height: 5px; border-radius: 50%; background: #e8202a; box-shadow: 0 0 6px rgba(232,32,42,0.7)"></span>{{auto}}</button>
    </sc-if>
  </div>

  <sc-if value="{{wheel}}"><div aria-hidden="true" style="position: absolute; left: 0; top: 44px; width: 412px; height: 98px; overflow: hidden"><div class="wheelp" style="width: 412px; height: 150px; background-position: 0 {{offset}}px"></div></div></sc-if>
  <div role="slider" aria-label="{{label}}" aria-valuemin="-5" aria-valuemax="5" aria-valuenow="{{valueNow}}" aria-valuetext="{{valueText}} {{unit}}" tabindex="0"
       onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}"
       style="position: absolute; left: 0; top: {{hitT}}px; width: {{hitW}}px; height: {{hitH}}px; touch-action: none; cursor: ew-resize; outline: none"></div>
  <sc-if value="{{wheel}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 50px; margin-left: -4px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #e8202a"></span></sc-if>
</div>
</template>
<template data-dc="Strip">
<div class="hscroll" role="listbox" aria-label="{{label}}" style="position: relative; width: 412px; height: 92px; display: flex; gap: 8px; padding: 2px 14px 0; box-sizing: border-box; align-items: flex-start; font-family: Inter, system-ui, sans-serif">
  <sc-if value="{{none}}" hint-placeholder-val="{{false}}"><span style="align-self: center; font-size: 11.5px; color: #80848a">{{empty}}</span></sc-if>
  <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
    <button role="option" aria-selected="{{t.on}}" aria-label="{{t.name}}" onClick="{{t.pick}}" style="flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 5px">
      <span style="position: relative; width: 84px; height: 58px; border-radius: 9px; overflow: hidden; background: #000; box-shadow: 0 0 0 {{t.ringW}}px {{t.ring}}, 0 2px 6px rgba(0,0,0,0.6)">
        <img src="{{t.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: {{t.imgShow}}; filter: {{t.filter}}">
        <span aria-hidden="true" style="position: absolute; inset: 0; display: {{t.glyphShow}}; align-items: center; justify-content: center; font-size: 24px; color: #f2efe8; background: rgba(232,32,42,0.25)">{{t.glyph}}</span>
        <span style="position: absolute; left: 4px; top: 4px; display: {{t.tagShow}}; padding: 1px 5px; border-radius: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.1em; color: #f2efe8; background: rgba(0,0,0,0.6)">{{t.tag}}</span>
      </span>
      <span class="eng" style="max-width: 84px; font-size: 9.5px; font-weight: 600; letter-spacing: 0.05em; color: {{t.ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
    </button>
  </sc-for>
</div>
</template>
<template data-dc="GradeWheel">
<div style="width: 412px; height: 196px; position: relative; color: #eceff4; font-family: Inter, system-ui, sans-serif; user-select: none">
  <div role="slider" aria-label="{{zone}} hue and saturation" aria-valuetext="Hue {{hue}} degrees, saturation {{sat}}" class="gw" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}"
       style="position: absolute; left: 22px; top: 8px; width: 176px; height: 176px; border-radius: 50%; touch-action: none; cursor: grab; box-shadow: 0 0 0 1px rgba(0,0,0,0.8), 0 0 0 3px #2c2e2f, 0 0 0 4px rgba(255,255,255,0.10), 0 6px 14px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.12)">
    <span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: rgba(255,255,255,0.35)"></span>
    <span aria-hidden="true" style="position: absolute; left: {{px}}px; top: {{py}}px; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: {{puck}}; box-shadow: 0 0 0 2px #f2efe8, 0 2px 6px rgba(0,0,0,0.7)"></span>
  </div>
  <div style="position: absolute; left: 222px; top: 10px; width: 170px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #f2efe8">{{zoneUp}}</span><span style="font-size: 10px; letter-spacing: 0.06em; color: #a6b0bc; font-variant-numeric: tabular-nums">{{tint}}</span></div>
    <div role="slider" aria-label="{{zone}} brightness" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="{{lumNow}}" onPointerDown="{{lDown}}" onPointerMove="{{lMove}}" onPointerUp="{{lUp}}" onPointerCancel="{{lUp}}"
         style="position: relative; margin-top: 10px; width: 160px; height: 44px; left: 5px; border-radius: 10px; touch-action: none; cursor: ew-resize; background: linear-gradient(180deg, rgba(8,9,10,0.55), rgba(8,9,10,0.32)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), inset 0 2px 6px rgba(0,0,0,0.55)">
      <span style="position: absolute; left: 10px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">BRIGHTNESS</span>
      <span aria-hidden="true" style="position: absolute; left: 8px; right: 8px; top: 31px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: rgba(255,255,255,0.13)"></span>
      <span aria-hidden="true" style="position: absolute; left: 80px; top: 31px; width: 1.5px; height: 9px; margin: -4.5px 0 0 -0.75px; background: #6a6e73"></span>
      <span aria-hidden="true" style="position: absolute; left: {{fillL}}px; width: {{fillW}}px; top: 31px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a"></span>
      <span style="position: absolute; left: {{knobX}}px; top: 31px; transform: translate(-50%, -50%); height: 18px; padding: 0 7px; border-radius: 9px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums">{{lumText}}</span>
    </div>
    <div style="display: flex; gap: 12px; margin: 18px 0 0 6px">
      <sc-for list="{{minis}}" as="m" hint-placeholder-count="3">
        <button onClick="{{m.pick}}" aria-label="{{m.name}}" style="display: flex; flex-direction: column; align-items: center; gap: 5px">
          <span class="gw" aria-hidden="true" style="position: relative; width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,0.8), 0 0 0 2px #2c2e2f, inset 0 0 0 1px rgba(255,255,255,0.12)"><span style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: {{m.puck}}; box-shadow: 0 0 0 1.5px #f2efe8"></span></span>
          <span class="eng" style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.14em; color: #80848a">{{m.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</div>
</template>
<template data-dc="CurveOverlay">
<div onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" role="group" aria-label="Tone curve, {{channel}} channel. Drag a point; tap the line to add one."
     style="width: 300px; height: 300px; position: relative; border-radius: 18px; overflow: hidden; touch-action: none; background: rgba(8,9,11,0.55); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 18px 40px rgba(0,0,0,0.5); font-family: Inter, system-ui, sans-serif">
  <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0" aria-hidden="true">
    <path d="{{hill}}" fill="rgba(255,255,255,0.07)"/>
    <path d="M14 105.3H286M14 196.7H286M105.3 14V286M196.7 14V286" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M14 286L286 14" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="{{path}}" fill="none" stroke="{{ink}}" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <sc-for list="{{dots}}" as="p" hint-placeholder-count="4">
    <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; background: {{p.bg}}; box-shadow: 0 0 0 2px {{p.ring}}, 0 2px 6px rgba(0,0,0,0.6)"></span>
  </sc-for>
  <span style="position: absolute; left: 14px; top: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: {{ink}}">{{chanUp}}</span>
  <span style="position: absolute; right: 14px; top: 10px; font-size: 10px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{readout}}</span>
</div>
</template>
<template data-dc="Drum">
<div role="listbox" aria-label="Sections: {{now}}" aria-orientation="vertical" tabindex="0" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}"
     style="width: 80px; height: 52px; position: relative; border-radius: 10px; overflow: hidden; touch-action: none; cursor: ns-resize; perspective: 240px; background: #0b0c0d; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10), 0 1px 0 rgba(255,255,255,0.07), 0 2px 6px rgba(0,0,0,0.6); user-select: none; outline: none; font-family: Inter, system-ui, sans-serif">
  <div style="position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(-{{r}}px) rotateX({{angle}}deg); transition: {{ease}}">
    <sc-for list="{{faces}}" as="f" hint-placeholder-count="9">
      <span role="option" aria-selected="{{f.on}}" class="eng" style="position: absolute; left: 0; right: 0; top: 50%; height: {{fh}}px; margin-top: -{{half}}px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; transform: rotateX({{f.a}}deg) translateZ({{r}}px); background: linear-gradient(180deg, #323435, #1c1d1e); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.7); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: {{f.ink}}">{{f.label}}<sup style="font-size: 7.5px; letter-spacing: 0; margin-left: 2px; color: {{f.countInk}}">{{f.count}}</sup></span>
    </sc-for>
  </div>
  <span aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.82) 0, rgba(0,0,0,0) 36%, rgba(0,0,0,0) 64%, rgba(0,0,0,0.82) 100%)"></span>
  <span aria-hidden="true" style="position: absolute; left: 3px; top: 50%; margin-top: -4px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid #e8202a"></span>
</div>
</template>
<template data-dc="Row">
<div class="hscroll" role="toolbar" aria-label="{{label}}" style="width: {{wide}}px; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 4px; box-sizing: border-box">
  <sc-for list="{{chips}}" as="p" hint-placeholder-count="7">
        <button onClick="{{p.pick}}" aria-pressed="{{p.on}}" aria-label="{{p.aria}}" class="eng fly" style="--dx: {{p.dx}}px; animation-name: {{p.anim}}; animation-delay: {{p.delay}}ms; flex: none; position: relative; height: 38px; padding: 0 {{p.pad}}px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 6px; box-shadow: {{p.box}}">
          <sc-if value="{{p.isDot}}" hint-placeholder-val="{{false}}"><span style="width: 13px; height: 13px; border-radius: 50%; background: {{p.dot}}; box-shadow: {{p.dotRing}}"></span></sc-if>
          <sc-if value="{{p.isDropper}}" hint-placeholder-val="{{false}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#dedbd4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5l5 5M17 2.5l4.5 4.5-3 3-4.5-4.5z"/><path d="M15 9l-9 9-2.5.5.5-2.5 9-9"/></svg></sc-if>
          <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: {{p.ink}}; white-space: nowrap">{{p.name}}</span>
          <span style="font-size: 9px; letter-spacing: 0.04em; color: {{p.valueInk}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{p.value}}</span>
          <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; border-radius: 1px; background: {{p.bar}}"></span>
        </button>
  </sc-for>
</div>
</template>
</body>
</html>
