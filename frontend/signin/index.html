<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Sign in · Thunderhead</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/ui/theme.js"></script>
<link rel="preload" href="/ui/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/forms.css">
<link rel="stylesheet" href="/ui/auth.css">
<link rel="stylesheet" href="/ui/shell.css">
<script type="module" src="/signin/signin.js"></script>
</head>
<body>
<div class="bg"><div class="field"></div><div class="grain"></div></div>
<main class="auth">
  <h1>Thunderhead</h1>
  <p class="reason" id="reason" hidden></p>
  <div class="panel">
    <form id="signin" method="post" action="/signin/" novalidate>
      <div class="fld">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="fld">
        <label for="current-password">Password</label>
        <div class="inp">
          <input id="current-password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="show" id="show" aria-pressed="false" aria-label="Show password as plain text. Warning: this will display your password on the screen.">Show</button>
        </div>
      </div>
      <button type="submit" class="btn" id="go">Sign in</button>
      <p class="line" id="line"></p>
      <div class="links"><a class="link" id="forgot" href="/recover/">Forgot password?</a><button type="button" class="link" id="reload" hidden>Reload</button></div>
    </form>
  </div>
  <p class="sr" id="sr" role="status" aria-live="polite"></p>
</main>
</body>
</html>
