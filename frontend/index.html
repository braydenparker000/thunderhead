<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>Thunderhead</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="referrer" content="no-referrer">
<script src="/ui/theme.js"></script>
<link rel="preload" href="/ui/fonts/Switzer.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/apps/home/home.css">
<link rel="stylesheet" href="/ui/forms.css">
<link rel="stylesheet" href="/apps/settings/settings.css">
<link rel="stylesheet" href="/apps/home/chat.css">
<link rel="stylesheet" href="/apps/home/menu.css">
<link rel="stylesheet" href="/apps/home/blocks.css">
<link rel="stylesheet" href="/ui/shell.css">
<script type="module" src="/apps/home/home.js"></script>
<script type="module" src="/apps/home/boot.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="skips"><button type="button" data-skip="apps">Apps</button><button type="button" data-skip="brief">Briefing</button><button type="button" data-skip="side">Menu</button></div>
  <div class="field"></div>
  <div class="grain"></div>

  <main class="page home" id="home">
  <div class="top"><span id="date">Today</span><button type="button" class="status" id="status" role="status" hidden></button></div>

  <div class="convo" id="convo">
    <div class="spacer"></div>
    <div id="turns" class="turns"></div>
    <div class="hint" id="hint"><i></i>Hold for apps · swipe for more</div>
  </div>

  <div class="opts" id="opts" role="menu" aria-label="Add">
    <button type="button" role="menuitem" style="--i:1;--c:#8b5cf6" data-act="camera" data-toast="Camera comes with sign-in"><span class="oi"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#camera"/></svg></span>Camera</button><button type="button" role="menuitem" style="--i:2;--c:#2f7df6" data-act="photos" data-toast="Photos comes with sign-in"><span class="oi"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#image"/></svg></span>Photos</button><button type="button" role="menuitem" style="--i:3;--c:#14a39a" data-act="files" data-toast="Files comes with sign-in"><span class="oi"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#file-text"/></svg></span>Files</button><button type="button" role="menuitem" style="--i:4;--c:#e0457b" data-act="memo" data-toast="Voice memo comes with sign-in"><span class="oi"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#waveform"/></svg></span>Voice memo</button><button type="button" role="menuitem" style="--i:5;--c:#e08a1e" data-act="remind" data-toast="Remind me comes with sign-in"><span class="oi"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#alarm"/></svg></span>Remind me</button>
  </div>
  <form class="ask" id="ask" autocomplete="off">
    <button class="plusBtn" id="plus" type="button" aria-label="Add" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#plus"/></svg></button>
    <textarea id="q" rows="1" placeholder="Ask anything" aria-label="Message the Thunderhead" enterkeyhint="send" autocomplete="off"></textarea>
    <div class="btns">
      <button class="mic" id="mic" type="button" aria-label="Voice memo, or hold to dictate"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#microphone"/></svg></button>
      <button class="send" type="submit" aria-label="Send"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#arrow-up"/></svg></button>
    </div>
  </form>
  </main>

  <section class="page brief" id="brief" aria-label="Briefing">
    <div class="bhead" id="bdate">Briefing</div>
    <div class="voice btitle"><span class="ln">Here's your day.</span></div>
    <div class="grid">
      <div class="tile wide">
        <span class="k"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#moon-stars"/></svg>Briefing</span>
        <span class="v">Your day fills in here once you sign in.</span>
        <span class="s">The weather, what waits on you, and what the night arranged.</span>
      </div>
    </div>
    <button class="bnote" type="button" id="bback">Back home</button>
  </section>

  <div class="dim" id="dim"></div>
  <nav class="side" id="side" aria-label="Menu">
    <div class="field" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="sidescroll" id="sidescroll">
      <h2 class="sidetitle">Conversations</h2>
      <p class="sidelead">A fresh one starts on its own each morning. Nothing to start or name.</p>
      <button class="row cur" id="now" type="button" data-toast="This is the current conversation"><span class="live" aria-hidden="true"></span><span class="t">Now</span><small></small></button>
      <div id="convos"></div>
    </div>
    <div class="sidebar">
      <button class="search" id="search" type="button" data-toast="Search comes with sign-in"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#magnifying-glass"/></svg>Search everything</button>
      <button class="setbtn" id="settings" type="button" data-open="settings" data-toast="Settings comes with sign-in" aria-label="Settings"><svg class="i" aria-hidden="true"><use href="/ui/icons.svg#gear-six"/></svg></button>
    </div>
  </nav>

  <div class="edge calm breathe" id="edge"></div>
  <div class="scrim" id="scrim"></div>
  <div class="press" id="press"></div>
  <div class="ring" id="ring" aria-hidden="true"><div class="hub" id="hub"></div><div class="lbl" id="lbl"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</body>
</html>
