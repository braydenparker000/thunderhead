<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tone curve overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#111}</style>
</helmet>
<div onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" role="group" aria-label="Tone curve, {{channel}} channel. Drag a point; tap the line to add one."
     style="width: 300px; height: 300px; position: relative; border-radius: 18px; overflow: hidden; touch-action: none; background: rgba(8,9,11,0.55); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 18px 40px rgba(0,0,0,0.5); font-family: Inter, system-ui, sans-serif">
  <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0" aria-hidden="true">
    <path d="M14 286 C40 280 52 230 74 236 S110 160 128 190 S170 120 190 150 S236 210 252 240 S280 270 286 286 Z" fill="rgba(255,255,255,0.07)"/>
    <path d="M14 105.3H286M14 196.7H286M105.3 14V286M196.7 14V286" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M14 286L286 14" stroke="rgba(255,255,255,0.18)" stroke-width="1" stroke-dasharray="3 4"/>
    <path d="{{path}}" fill="none" stroke="{{ink}}" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <sc-for list="{{dots}}" as="p" hint-placeholder-count="4">
    <span style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.s}}px; height: {{p.s}}px; margin: {{p.m}}px 0 0 {{p.m}}px; border-radius: 50%; background: {{p.bg}}; box-shadow: 0 0 0 2px {{p.ring}}, 0 2px 6px rgba(0,0,0,0.6)"></span>
  </sc-for>
  <span style="position: absolute; left: 14px; top: 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: {{ink}}">{{chanUp}}</span>
  <span style="position: absolute; right: 14px; top: 10px; font-size: 10px; color: #a6b0bc; font-variant-numeric: tabular-nums">{{readout}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"channel":{"editor":"text","default":"RGB"},"$preview":{"width":300,"height":300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const base = () => [[0, 0], [0.25, 0.21], [0.75, 0.80], [1, 1]];
    this.state = { curves: { RGB: base(), R: [[0, 0], [1, 1]], G: [[0, 0], [1, 1]], B: [[0, 0], [1, 1]] }, sel: 1 };
    this.drag = null;
  }
  renderVals() {
    const ch = this.props.channel ?? 'RGB';
    const pts = this.state.curves[ch] || [[0, 0], [1, 1]];
    const X = (u) => 14 + u * 272, Y = (v) => 286 - v * 272;
    // monotone cubic (Fritsch-Carlson) through the points, as Lightroom draws its curve
    const n = pts.length, m = [], dk = [];
    for (let i = 0; i < n - 1; i++) dk.push((pts[i + 1][1] - pts[i][1]) / Math.max(1e-6, pts[i + 1][0] - pts[i][0]));
    for (let i = 0; i < n; i++) m.push(i === 0 ? dk[0] : i === n - 1 ? dk[n - 2] : (dk[i - 1] * dk[i] <= 0 ? 0 : (dk[i - 1] + dk[i]) / 2));
    let path = `M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], h = (x1 - x0) / 3;
      path += ` C${X(x0 + h).toFixed(1)} ${Y(y0 + m[i] * h).toFixed(1)} ${X(x1 - h).toFixed(1)} ${Y(y1 - m[i + 1] * h).toFixed(1)} ${X(x1).toFixed(1)} ${Y(y1).toFixed(1)}`;
    }
    const ink = { RGB: '#eceff4', R: '#ff6b6b', G: '#5fd38d', B: '#6aa2ff' }[ch];
    const sel = Math.min(this.state.sel, n - 1);
    const dots = pts.map(([u, v], i) => ({ x: X(u), y: Y(v), s: i === sel ? 14 : 10, m: i === sel ? -7 : -5, bg: i === sel ? ink : '#0b0c0e', ring: ink }));
    const setPts = (next, s) => this.setState({ curves: { ...this.state.curves, [ch]: next }, sel: s });
    const local = (e) => { const r = e.currentTarget.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - r.left - 14) / 272)), Math.max(0, Math.min(1, (286 - (e.clientY - r.top)) / 272))]; };
    return {
      channel: ch, chanUp: ch === 'RGB' ? 'RGB · TONE CURVE' : `${ch} CHANNEL`, ink, path, dots,
      readout: `In ${Math.round(pts[sel][0] * 255)} · Out ${Math.round(pts[sel][1] * 255)}`,
      down: (e) => {
        const [u, v] = local(e);
        let best = -1, bd = 0.06;
        pts.forEach(([pu, pv], i) => { const d = Math.hypot(pu - u, pv - v); if (d < bd) { bd = d; best = i; } });
        if (best < 0) { const next = [...pts, [u, v]].sort((a, b) => a[0] - b[0]); best = next.findIndex((p) => p[0] === u); setPts(next, best); } else this.setState({ sel: best });
        this.drag = best;
        if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
      },
      move: (e) => {
        if (this.drag === null) return;
        const [u, v] = local(e), i = this.drag, cur = this.state.curves[ch];
        const lo = i === 0 ? 0 : cur[i - 1][0] + 0.02, hi = i === cur.length - 1 ? 1 : cur[i + 1][0] - 0.02;
        const next = cur.map((p, k) => (k === i ? [i === 0 || i === cur.length - 1 ? p[0] : Math.max(lo, Math.min(hi, u)), v] : p));
        setPts(next, i);
      },
      up: () => { this.drag = null; },
    };
  }
}
</script>
</body>
</html>
