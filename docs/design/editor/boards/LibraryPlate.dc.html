<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library · grid and culling</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000}
a{color:#6aa2ff}a:hover{color:#9cc0ff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.glass{background:linear-gradient(180deg,rgba(255,255,255,0.17),rgba(255,255,255,0.06));-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,0.22);box-shadow:inset 0 1px 0 rgba(255,255,255,0.38),inset 0 -1px 1px rgba(255,255,255,0.06),0 14px 34px rgba(0,0,0,0.55)}
.lens{background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,0.34),rgba(255,255,255,0.10) 60%,rgba(255,255,255,0.06));box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),inset 0 -2px 6px rgba(0,0,0,0.25)}
.hscroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}.hscroll::-webkit-scrollbar{display:none}
.fly{animation-duration:440ms;animation-timing-function:cubic-bezier(0.2,0.9,0.25,1.15);animation-fill-mode:both}
@keyframes fly0{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly1{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly2{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly3{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly4{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly5{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly6{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}@keyframes fly7{from{opacity:0;transform:translate(var(--dx),44px) scale(0.35)}to{opacity:1;transform:none}}
.eng{text-shadow:0 -1px 0 rgba(0,0,0,0.85),0 1px 0 rgba(255,255,255,0.06)}
.key{background:linear-gradient(180deg,#2c2e2f,#1b1c1d);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),inset 0 -1px 0 rgba(0,0,0,0.5),0 0 0 1px #0b0c0c,0 2px 4px rgba(0,0,0,0.7)}
.scan{animation:scan 1.1s linear infinite}@keyframes scan{from{background-position:120% 0}to{background-position:-120% 0}}
.tile{animation-duration:360ms;animation-timing-function:cubic-bezier(0.2,0.9,0.25,1.1);animation-fill-mode:both;animation-delay:var(--d)}@keyframes tl0{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl1{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl2{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl3{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl4{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl5{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl6{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}@keyframes tl7{from{opacity:0;transform:translateY(14px) scale(0.9)}to{opacity:1;transform:none}}
.grain{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1.4 -0.45'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;pointer-events:none}
.vscroll{overflow-y:auto;scrollbar-width:none}.vscroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; position: relative; background: #000000; color: #eceff4; font-family: Inter, system-ui, sans-serif; overflow: hidden">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; z-index: 2; background: linear-gradient(180deg, #000 70%, rgba(0,0,0,0))">
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">{{title}}</div>
      <div style="font-size: 11px; color: #8b95a1; font-variant-numeric: tabular-nums">{{subtitle}}</div>
    </div>
    <button onClick="{{toggleImport}}" aria-expanded="{{importing}}" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #e8202a; color: #fff; font-size: 13px; font-weight: 600">Import</button>
  </header>

  <sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
    <div class="vscroll" style="position: absolute; top: 56px; left: 0; right: 0; height: 734px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div style="position: sticky; top: 0; z-index: 1; padding: 10px 16px 6px; background: rgba(0,0,0,0.88); font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: #a6b0bc">{{g.title}}<span style="color: #5d6166; margin-left: 8px">{{g.count}}</span></div>
        <div style="display: grid; grid-template-columns: repeat({{cols}}, minmax(0, 1fr)); gap: 2px">
          <sc-for list="{{g.items}}" as="p" hint-placeholder-count="6">
            <button onClick="{{p.open}}" aria-label="{{p.aria}}" style="position: relative; aspect-ratio: 1; overflow: hidden; background: #111; opacity: {{p.dim}}">
              <img src="/_blob/ebb81bda9f92b6c6da9428edc5304d7b" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}}; transform: scale({{p.zoom}}); filter: {{p.filter}}; display: block">
              <span style="position: absolute; left: 5px; top: 4px; font-size: 11px; color: {{p.flagInk}}; text-shadow: 0 1px 2px rgba(0,0,0,0.9)">{{p.flag}}</span>
              <span style="position: absolute; right: 5px; top: 5px; font-size: 7.5px; font-weight: 700; letter-spacing: 0.08em; padding: 1px 4px; border-radius: 4px; background: rgba(0,0,0,0.6); color: #dedbd4">{{p.sim}}</span>
              <span style="position: absolute; left: 5px; bottom: 3px; font-size: 9px; letter-spacing: 1px; color: #f2efe8; text-shadow: 0 1px 2px rgba(0,0,0,0.9)">{{p.stars}}</span>
              <span style="position: absolute; right: 6px; bottom: 6px; width: 6px; height: 6px; border-radius: 50%; background: {{p.edited}}"></span>
            </button>
          </sc-for>
        </div>
      </sc-for>
      <div style="height: 20px"></div>
    </div>
  </sc-if>

  <sc-if value="{{isCull}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; top: 56px; left: 0; width: 412px; height: 536px; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <img src="/_blob/ebb81bda9f92b6c6da9428edc5304d7b" alt="{{cur.aria}}" style="width: 392px; height: 392px; object-fit: cover; object-position: {{cur.pos}}; transform: scale({{cur.zoom}}); filter: {{cur.filter}}; opacity: {{cur.dim}}; display: block; border-radius: 4px">
      <span class="glass" style="position: absolute; left: 12px; top: 12px; padding: 5px 10px; border-radius: 12px; font-size: 11px; font-variant-numeric: tabular-nums">{{cur.meta}}</span>
      <span style="position: absolute; left: 22px; bottom: 58px; font-size: 22px; color: {{cur.flagInk}}; text-shadow: 0 1px 4px rgba(0,0,0,0.9)">{{cur.flag}}</span>
      <div class="hscroll" aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 6px; height: 40px; display: flex; gap: 3px; justify-content: center">
        <sc-for list="{{strip}}" as="s" hint-placeholder-count="9">
          <span style="flex: none; width: 34px; height: 34px; margin-top: {{s.lift}}px; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 {{s.ringW}}px #e8202a; opacity: {{s.o}}"><img src="/_blob/ebb81bda9f92b6c6da9428edc5304d7b" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: {{s.pos}}; filter: {{s.filter}}; display: block"></span>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{importing}}" hint-placeholder-val="{{false}}">
    <div class="glass" role="dialog" aria-label="Import photos" style="position: absolute; left: 12px; right: 12px; top: 64px; padding: 14px; box-sizing: border-box; border-radius: 20px; z-index: 4">
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 4px">Import photos</div>
      <div style="font-size: 11px; color: #a6b0bc; margin-bottom: 10px">RAFs stay on this phone. Thumbnails come from the preview inside each RAF, so they appear at once.</div>
      <sc-for list="{{sources}}" as="o" hint-placeholder-count="3">
        <button onClick="{{o.pick}}" style="width: 100%; min-height: 50px; margin-bottom: 6px; padding: 8px 12px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; gap: 12px; text-align: left; background: rgba(255,255,255,0.07)">
          <span aria-hidden="true" style="flex: none; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #e8202a; font-size: 15px">{{o.glyph}}</span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">{{o.name}}</span><span style="font-size: 10.5px; color: #a6b0bc">{{o.note}}</span></span>
        </button>
      </sc-for>
      <sc-if value="{{progress}}" hint-placeholder-val="{{false}}">
        <div role="status" style="margin-top: 4px; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,0.35); font-size: 11.5px">
          <div style="display: flex; justify-content: space-between; margin-bottom: 7px"><span>{{progText}}</span><span style="color: #a6b0bc; font-variant-numeric: tabular-nums">{{progCount}}</span></div>
          <div style="height: 3px; border-radius: 2px; background: #1c1e20"><div style="width: {{progPct}}%; height: 3px; border-radius: 2px; background: #e8202a; transition: width 300ms linear"></div></div>
        </div>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; top: 790px; width: 412px; height: 125px; background: #232525 url(/_blob/bc712267550fdecbb140e0d1d15fef3f) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
      <nav aria-label="Show" style="position: absolute; left: 8px; right: 8px; top: 12px; height: 34px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button onClick="{{f.pick}}" aria-current="{{f.current}}" class="eng" style="position: relative; height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
            <span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{f.dot}}"></span>
            <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{f.ink}}">{{f.label}}</span>
            <span style="font-size: 9px; color: {{f.countInk}}; font-variant-numeric: tabular-nums">{{f.count}}</span>
          </button>
        </sc-for>
      </nav>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 22px; display: flex; gap: 8px">
        <button class="key" onClick="{{toCull}}" style="height: 40px; padding: 0 16px; border-radius: 12px; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: #e8202a; box-shadow: 0 0 6px rgba(232,32,42,0.7)"></span>CULL</button>
        <button class="key" onClick="{{cycleSort}}" style="height: 40px; padding: 0 16px; border-radius: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">{{sortName}}</button>
        <button class="key" onClick="{{cycleSize}}" aria-label="Thumbnail size" style="margin-left: auto; width: 40px; height: 40px; border-radius: 12px; font-size: 14px; color: #dedbd4">{{sizeGlyph}}</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{isCull}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; top: 600px; width: 412px; height: 315px; background: #232525 url(/_blob/bc712267550fdecbb140e0d1d15fef3f) 0 0 / 412px 315px no-repeat; box-shadow: 0 -10px 24px rgba(0,0,0,0.7)">
      <div role="status" aria-label="Photo {{pos}} of {{total}}" style="position: absolute; left: 20px; top: 10px; width: 372px; height: 44px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #050606, #0b0c0d); box-shadow: inset 0 2px 5px rgba(0,0,0,0.95), inset 0 0 0 1px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.10)">
        <span style="position: absolute; left: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #7d8187">ROLL · {{rollName}}</span>
        <span style="position: absolute; right: 12px; top: 6px; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #5d6166">{{total}}</span>
        <span style="position: absolute; left: 22px; right: 22px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #1c1e20"></span>
        <sc-for list="{{marks}}" as="m" hint-placeholder-count="10"><span style="position: absolute; left: {{m.x}}px; top: 26px; width: 1.5px; height: 8px; background: {{m.c}}"></span></sc-for>
        <span style="position: absolute; left: 22px; width: {{fillW}}px; top: 30px; height: 3px; margin-top: -1.5px; border-radius: 2px; background: #e8202a; box-shadow: 0 0 8px rgba(232,32,42,0.55)"></span>
        <span style="position: absolute; left: {{numX}}px; top: 30px; transform: translate(-50%, -50%); height: 20px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; background: #0b0c0d; box-shadow: 0 0 0 1.5px #e8202a, 0 2px 6px rgba(0,0,0,0.8); color: #f2efe8; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap">{{pos}}</span>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 0; top: 58px; width: 412px; height: 150px; background: url(/_blob/a0c3786c44b0ef98460647f4fc2dbe4c) 0 {{spinY}}px / 412px 1800px no-repeat"></div>
      <div role="slider" aria-label="Move through the roll" aria-valuemin="1" aria-valuemax="{{total}}" aria-valuenow="{{pos}}" tabindex="0"
           onPointerDown="{{dDown}}" onPointerMove="{{dMove}}" onPointerUp="{{dUp}}" onPointerCancel="{{dUp}}" onKeyDown="{{dKey}}"
           style="position: absolute; left: 0; top: 58px; width: 412px; height: 108px; touch-action: none; cursor: ew-resize; outline: none"></div>
      <span aria-hidden="true" style="position: absolute; left: 50%; top: 64px; margin-left: -4px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #e8202a"></span>
      <div role="radiogroup" aria-label="Rating" style="position: absolute; left: 14px; right: 14px; top: 166px; height: 36px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
        <sc-for list="{{rates}}" as="r" hint-placeholder-count="6">
          <button role="radio" aria-checked="{{r.on}}" aria-label="{{r.aria}}" onClick="{{r.pick}}" class="eng" style="position: relative; height: 36px; font-size: {{r.size}}px; letter-spacing: 0.02em; color: {{r.ink}}">{{r.name}}<span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 12px; height: 2px; margin-left: -6px; background: {{r.bar}}"></span></button>
        </sc-for>
      </div>
      <nav aria-label="Flag" style="position: absolute; left: 14px; right: 14px; top: 206px; height: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <sc-for list="{{flags}}" as="f" hint-placeholder-count="3">
          <button onClick="{{f.pick}}" aria-pressed="{{f.on}}" class="eng" style="position: relative; height: 30px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: {{f.ink}}"><span aria-hidden="true" style="position: absolute; left: 50%; top: 0; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: {{f.dot}}"></span>{{f.label}}</button>
        </sc-for>
      </nav>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 22px; display: flex; gap: 8px">
        <button class="key" onClick="{{toGrid}}" style="height: 40px; padding: 0 16px; border-radius: 12px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4">‹ GRID</button>
        <button class="key" onClick="{{toggleSkip}}" aria-pressed="{{skip}}" style="height: 40px; padding: 0 14px; border-radius: 12px; display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: #dedbd4"><span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 50%; background: {{skipDot}}"></span>SKIP REJECTS</button>
        <button onClick="{{noop}}" style="margin-left: auto; height: 40px; padding: 0 18px; border-radius: 12px; background: #e8202a; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 2px 6px rgba(0,0,0,0.6)">EDIT ›</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // one sample image stands in for a roll: each "photo" is a different crop and look of it
    const sims = [['CC', 'contrast(1.12) saturate(0.72) sepia(0.08) hue-rotate(-6deg)'], ['AC', 'grayscale(1) contrast(1.25)'], ['CN', 'contrast(1.2) saturate(0.85) sepia(0.12) hue-rotate(-12deg)'], ['PV', 'none'], ['VV', 'contrast(1.18) saturate(1.5)']];
    const photos = [];
    for (let i = 0; i < 30; i++) {
      const s = sims[(i * 7 + (i >> 2)) % 5];
      photos.push({ id: i, n: 412 + i, pos: `${(i * 37) % 100}% ${(i * 53) % 100}%`, zoom: (1.3 + ((i * 29) % 13) / 10).toFixed(2), sim: s[0], filter: s[1],
        rating: [0, 3, 0, 4, 2, 0, 5, 0, 1, 3][i % 10], flag: i % 9 === 4 ? 'reject' : i % 4 === 1 ? 'pick' : 'none', edited: i % 5 === 2, shoot: i < 12 ? 0 : i < 24 ? 1 : 2 });
    }
    this.state = { view: 'grid', filter: 'All', sort: 0, cols: 3, idx: 6, photos, importing: false, progress: null, skip: false, spin: 0 };
    this.drag = null;
  }
  renderVals() {
    const S = this.state, set = (o) => this.setState(o), P = S.photos;
    const shoots = ['TODAY · OLD TOWN', 'NOV 7 · COAST', 'NOV 2 · HOME'];
    const tests = { All: () => true, Picks: (p) => p.flag === 'pick', Rated: (p) => p.rating > 0, Edited: (p) => p.edited, Rejects: (p) => p.flag === 'reject' };
    const shown = P.filter(tests[S.filter]);
    const sorts = ['NEWEST', 'OLDEST', 'RATING'];
    const order = (list) => S.sort === 1 ? [...list].reverse() : S.sort === 2 ? [...list].sort((a, b) => b.rating - a.rating) : list;
    const tile = (p) => ({ aria: `DSCF0${p.n}${p.rating ? `, ${p.rating} stars` : ''}${p.flag !== 'none' ? `, ${p.flag}` : ''}`,
      pos: p.pos, zoom: p.zoom, filter: p.filter, sim: p.sim, stars: '★'.repeat(p.rating), edited: p.edited ? '#e8202a' : 'transparent',
      flag: p.flag === 'pick' ? '⚑' : p.flag === 'reject' ? '✕' : '', flagInk: p.flag === 'reject' ? '#e8202a' : '#f2efe8', dim: p.flag === 'reject' ? 0.45 : 1,
      open: () => set({ view: 'cull', idx: p.id }) });
    const groups = S.sort === 2 ? [{ title: 'BY RATING', count: String(shown.length), items: order(shown).map(tile) }]
      : (S.sort === 1 ? [2, 1, 0] : [0, 1, 2]).map((g) => ({ title: shoots[g], count: String(shown.filter((p) => p.shoot === g).length), items: order(shown.filter((p) => p.shoot === g)).map(tile) })).filter((g) => g.items.length);
    const cur = P[S.idx], n = P.length;
    const curT = tile(cur);
    const step = (from, dir) => { let i = from; do { i += dir; } while (S.skip && i >= 0 && i < n && P[i].flag === 'reject'); return i < 0 || i >= n ? from : i; };
    const setPhoto = (patch) => set({ photos: P.map((p) => (p.id === cur.id ? { ...p, ...patch } : p)) });
    const RD = 240, PERIOD = 360 / 72, frac = ((((-S.spin) / PERIOD) % 1) + 1) % 1;
    const span = 328, fx = (i) => 22 + (i / (n - 1)) * span;
    const runImport = (label) => {
      let k = 0; const total = 64;
      set({ progress: { label, k, total } });
      const tick = () => { k = Math.min(total, k + 8); this.setState({ progress: { label, k, total } }); if (k < total) setTimeout(tick, 220); };
      setTimeout(tick, 220);
    };
    const pr = S.progress;
    return {
      title: S.view === 'grid' ? 'Library' : ['Old town', 'Coast', 'Home'][cur.shoot], subtitle: S.view === 'grid' ? `${shown.length} of ${n} photos · 3 shoots` : `DSCF0${cur.n}.RAF · ${cur.sim === 'AC' ? 'Acros' : cur.sim === 'CN' ? 'Classic Neg' : cur.sim === 'PV' ? 'Provia' : cur.sim === 'VV' ? 'Velvia' : 'Classic Chrome'}`,
      isGrid: S.view === 'grid', isCull: S.view === 'cull', groups, cols: S.cols,
      importing: S.importing, toggleImport: () => set({ importing: !S.importing, progress: null }),
      sources: [{ glyph: '▦', name: 'Choose photos', note: 'Pick RAFs or JPEGs from the phone’s files', pick: () => runImport('Reading previews') },
        { glyph: '▣', name: 'From a card or the camera', note: 'Plug in the SD reader or the X-E5 by USB-C, then pick its DCIM folder', pick: () => runImport('Copying from the card') },
        { glyph: '↻', name: 'Watch a folder', note: 'New RAFs in a chosen folder come in by themselves when the app opens', pick: () => runImport('Checking the folder') }],
      progress: !!pr, progText: pr ? (pr.k < pr.total ? `${pr.label}…` : 'Done · 64 photos in Today') : '', progCount: pr ? `${pr.k} / ${pr.total}` : '', progPct: pr ? Math.round((pr.k / pr.total) * 100) : 0,
      filters: Object.keys(tests).map((f) => ({ label: f.toUpperCase(), count: String(P.filter(tests[f]).length), current: String(f === S.filter),
        ink: f === S.filter ? '#f2efe8' : '#7d8187', dot: f === S.filter ? '#e8202a' : 'transparent', countInk: f === S.filter ? '#e8202a' : '#5d6166', pick: () => set({ filter: f }) })),
      toCull: () => set({ view: 'cull' }), cycleSort: () => set({ sort: (S.sort + 1) % 3 }), sortName: `${sorts[S.sort]} ▾`,
      cycleSize: () => set({ cols: S.cols === 3 ? 4 : S.cols === 4 ? 2 : 3 }), sizeGlyph: S.cols === 4 ? '▦' : S.cols === 2 ? '◫' : '▤',
      cur: { ...curT, meta: `${S.idx + 1} / ${n} · ${cur.sim}` },
      strip: [-4, -3, -2, -1, 0, 1, 2, 3, 4].map((d) => { const p = P[Math.max(0, Math.min(n - 1, S.idx + d))]; const out = S.idx + d < 0 || S.idx + d >= n;
        return { pos: p.pos, filter: p.filter, ringW: d === 0 ? 2 : 0, lift: d === 0 ? 0 : 3, o: out ? 0 : d === 0 ? 1 : p.flag === 'reject' ? 0.3 : 0.65 }; }),
      rollName: shoots[cur.shoot].split(' · ')[1], pos: String(S.idx + 1), total: String(n),
      marks: P.map((p, i) => ({ x: fx(i).toFixed(1), c: p.flag === 'pick' ? 'rgba(242,239,232,0.75)' : p.flag === 'reject' ? 'rgba(232,32,42,0.6)' : 'transparent' })),
      fillW: (fx(S.idx) - 22).toFixed(1), numX: Math.max(30, Math.min(342, fx(S.idx))).toFixed(1), spinY: -Math.floor(frac * 12) * 150,
      dDown: (e) => { this.drag = { x: e.clientX, s: S.spin, i: S.idx }; if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); },
      dMove: (e) => {
        const d = this.drag; if (!d) return; const deg = ((e.clientX - d.x) / RD) * (180 / Math.PI);
        let i = d.i; const k = Math.round(deg / 9);                 // one photo per 9 degree detent, like the camera's playback
        for (let j = 0; j < Math.abs(k); j++) i = step(i, Math.sign(k));
        this.setState({ spin: d.s + deg, idx: i });
      },
      dUp: () => { this.drag = null; },
      dKey: (e) => { if (e.key === 'ArrowRight') set({ idx: step(S.idx, 1) }); if (e.key === 'ArrowLeft') set({ idx: step(S.idx, -1) }); },
      rates: [0, 1, 2, 3, 4, 5].map((r) => ({ name: r === 0 ? '✕' : '★'.repeat(r), size: r === 0 ? 11 : r > 3 ? 9 : 11, aria: r === 0 ? 'No stars' : `${r} stars`, on: String(cur.rating === r),
        ink: cur.rating === r ? '#f2efe8' : '#7d8187', bar: cur.rating === r ? '#e8202a' : 'transparent', pick: () => setPhoto({ rating: r }) })),
      flags: [['pick', 'PICK ⚑'], ['none', 'UNFLAG'], ['reject', 'REJECT ✕']].map(([f, label]) => ({ label, on: String(cur.flag === f),
        ink: cur.flag === f ? (f === 'reject' ? '#e8202a' : '#f2efe8') : '#7d8187', dot: cur.flag === f ? '#e8202a' : 'transparent', pick: () => setPhoto({ flag: f }) })),
      toGrid: () => set({ view: 'grid' }), skip: String(S.skip), skipDot: S.skip ? '#e8202a' : '#4f5357', toggleSkip: () => set({ skip: !S.skip }), noop: () => {},
    };
  }
}
</script>
