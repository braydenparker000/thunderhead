[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;background:var(--ph-g0)}
body{height:100%;margin:0;background:var(--ph-g0);color:var(--ph-g4);font:400 var(--fs-body)/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ph-accent);outline-offset:2px}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic20{width:20px;height:20px}.ic16{width:16px;height:16px}.ic12{width:12px;height:12px}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--ph-g0);overflow:hidden;overflow:clip}
@media (min-width:600px){#app{border-left:1px solid var(--ph-g2);border-right:1px solid var(--ph-g2)}}

/* The prototype's own strip: not part of the design (mono, hatched) */
.proto{flex:none;height:var(--ph-proto-h);display:flex;align-items:center;gap:8px;padding-inline:8px;font:500 var(--fs-x-11)/1 var(--mono);color:var(--ph-g3);background:repeating-linear-gradient(135deg,var(--ph-g0) 0 6px,var(--ph-g1) 6px 12px);border-bottom:1px solid var(--ph-g2)}
.proto .ptag{letter-spacing:.08em;text-transform:uppercase;padding-inline:4px}
.proto .pbtn{height:22px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:var(--r-full);background:var(--ph-g2);color:var(--ph-g4);font:inherit;letter-spacing:.02em}
.proto .pbtn .ic{width:14px;height:14px}
.proto .grow{flex:1}
.ppanel{position:absolute;left:8px;right:8px;top:4px;z-index:60;background:var(--ph-g1);border:1px solid var(--ph-g2);border-radius:var(--r-m);padding:12px 12px 16px;box-shadow:0 18px 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:12px;font-family:var(--ui);max-height:calc(100% - 16px);overflow-y:auto}
.ppanel h3{margin:0;font:600 var(--fs-x-11)/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ph-g3)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pgrid button{height:36px;border-radius:var(--r-s);background:var(--ph-g2);font-size:var(--fs-small);font-weight:500;color:var(--ph-g4)}
.pgrid button.on{background:var(--ph-g4);color:var(--ph-g0)}
.prow{display:grid;gap:6px}
.prow>span{font-size:var(--fs-small);color:var(--ph-g3)}
.pnote{font-size:var(--fs-label);color:var(--ph-g3);line-height:1.4;margin:0}
.pfoot{display:flex;justify-content:flex-end}
.pfoot button{height:36px;padding:0 16px;border-radius:var(--r-full);background:var(--ph-g4);color:var(--ph-g0);font-weight:600;font-size:var(--fs-chip)}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--ph-g0)}

/* Shared controls */
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-full);color:var(--ph-g4);flex:none;transition:background-color var(--d-fast) ease,transform var(--d-fast) var(--ease-pop)}
.ib:active{background:var(--ph-g2);transform:scale(.94)}
.ib[disabled]{color:var(--ph-g3);opacity:.45;pointer-events:none}
.tbtn{height:36px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-small);font-weight:500;color:var(--ph-g4)}
.tbtn:active{background:var(--ph-g2)}
.chip{flex:none;height:32px;padding:0 12px;border-radius:var(--r-full);background:var(--ph-g1);color:var(--ph-g3);font-size:var(--fs-chip);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background-color var(--d-fast) ease,color var(--d-fast) ease}
.chip.on{background:var(--ph-g4);color:var(--ph-g0)}
.chip .n{font-size:var(--fs-label);opacity:.7}
.seg{display:flex;gap:2px;padding:2px;border-radius:var(--r-s);background:var(--ph-g0)}
.seg button{flex:1;min-width:0;height:36px;border-radius:8px;font-size:var(--fs-chip);font-weight:500;color:var(--ph-g3);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background-color var(--d-fast) ease,color var(--d-fast) ease}
.seg button.on{background:var(--ph-g2);color:var(--ph-g4)}
.seg .sub{font-size:var(--fs-x-11);color:var(--ph-g3);font-weight:400}
.tog{flex:none;width:44px;height:26px;border-radius:13px;background:var(--ph-g2);position:relative;transition:background-color var(--d-fast) ease}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--ph-g3);transition:transform var(--d-quick) var(--ease-pop),background-color var(--d-fast) ease}
.tog[aria-checked="true"]{background:var(--ph-accent)}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:var(--ph-on-accent)}
.btn{height:48px;width:100%;border-radius:var(--r-m);background:var(--ph-g4);color:var(--ph-g0);font-size:var(--fs-body);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--d-fast) var(--ease-pop)}
.btn:active{transform:scale(.98)}
.btn .ic{width:20px;height:20px}
.cap{font-size:var(--fs-label);color:var(--ph-g3);line-height:1.35;margin:0;text-align:center}

/* ---------- Shelf ---------- */
.stop{flex:none;display:flex;align-items:flex-end;gap:4px;padding:12px 6px 4px 16px;min-height:64px}
.stop .tt{flex:1;min-width:0}
.stitle{margin:0;font-size:var(--fs-heading);font-weight:600;line-height:28px;letter-spacing:-.01em}
.ssub{margin:2px 0 0;font-size:var(--fs-small);color:var(--ph-g3);line-height:18px}
.sfil{flex:none;display:flex;gap:8px;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.sfil::-webkit-scrollbar{display:none}
.banner{flex:none;margin:0 16px 8px;padding:8px 8px 8px 12px;border-radius:var(--r-m);background:var(--ph-g1);display:flex;align-items:center;gap:8px;font-size:var(--fs-small);color:var(--ph-g4)}
.banner .ic{color:var(--ph-accent)}
.banner span{flex:1;min-width:0}
.sscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}
.shelf.selecting .sscroll{padding-bottom:96px}
.dh{position:sticky;top:0;z-index:2;height:40px;display:flex;align-items:center;gap:8px;padding:0 6px 0 16px;background:var(--ph-scrim)}
.dh b{font-size:var(--fs-body);font-weight:600}
.dh span{flex:1;font-size:var(--fs-small);color:var(--ph-g3)}
.dh .tbtn{color:var(--ph-g3)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--ph-tile-gap);margin-bottom:24px}
.tile{position:relative;aspect-ratio:1;background:var(--ph-g1);overflow:hidden;cursor:pointer;-webkit-touch-callout:none}
.tile canvas{display:block;width:100%;height:100%;transition:transform var(--d-quick) var(--ease-out),border-radius var(--d-quick) var(--ease-out)}
.tile.shade::after{content:"";position:absolute;inset:auto 0 0;height:28px;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
.badge{position:absolute;z-index:1;left:4px;bottom:4px;height:16px;padding:0 4px;border-radius:4px;background:rgba(0,0,0,.62);color:var(--ph-g4);font-size:var(--fs-x-10-5);font-weight:600;letter-spacing:.02em;line-height:16px}
.stars{position:absolute;z-index:1;right:4px;bottom:4px;height:16px;display:flex;align-items:center;gap:2px;color:var(--ph-g4);font-size:var(--fs-x-10-5);font-weight:600;line-height:16px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.stars .ic{width:10px;height:10px;stroke-width:0;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.emark{position:absolute;z-index:1;right:4px;top:4px;width:16px;height:16px;border-radius:4px;background:rgba(0,0,0,.62);display:grid;place-items:center;color:var(--ph-g4)}
.emark .ic{width:12px;height:12px;stroke-width:1.8}
.tick{position:absolute;z-index:1;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:1.6px solid rgba(255,255,255,.9);background:rgba(0,0,0,.25);display:none;place-items:center;color:var(--ph-on-accent)}
.tick .ic{width:14px;height:14px;stroke-width:2.2;opacity:0}
.shelf.selecting .tick{display:grid}
.shelf.selecting .emark{display:none}
.tile.sel canvas{transform:scale(.86);border-radius:var(--r-xs)}
.tile.sel .tick{background:var(--ph-accent);border-color:var(--ph-accent)}
.tile.sel .tick .ic{opacity:1}
.selbar{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--ph-g1);border-top:1px solid var(--ph-g2);padding:8px 8px var(--ph-deck-pad);display:flex;align-items:center;gap:4px;transform:translateY(110%);transition:transform var(--d-quick) var(--ease-in)}
.shelf.selecting .selbar{transform:none;transition:transform var(--d-sheet) var(--ease-sheet)}
.selbar .cnt{flex:1;padding-left:8px;font-size:var(--fs-body);font-weight:600}
.act{width:60px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-label);font-weight:500;color:var(--ph-g4);border-radius:var(--r-m)}
.act:active{background:var(--ph-g2)}
.act[disabled]{opacity:.4;pointer-events:none}
.act.hot{color:var(--ph-accent)}
.rate{display:flex;gap:0}
.rate button{width:44px;height:56px;display:grid;place-items:center;color:var(--ph-g3)}
.rate button.on{color:var(--ph-g4)}

/* ---------- Editor ---------- */
.etop{flex:none;height:var(--ph-top-h);display:flex;align-items:center;padding-inline:6px;position:relative;z-index:3}
.etop .grow{flex:1}
.ephoto{position:relative;flex:1;min-height:120px;overflow:hidden;overflow:clip;background:var(--ph-g0);touch-action:none}
.pframe{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform var(--d-base) var(--ease-emph),clip-path var(--d-base) var(--ease-emph)}
.prot{position:absolute;inset:0;transition:transform var(--d-base) var(--ease-emph)}
.live .pframe,.live .prot{transition:none}
.prot canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{position:absolute;top:12px;height:24px;padding:0 10px;border-radius:var(--r-full);background:rgba(0,0,0,.62);color:var(--ph-g4);font-size:var(--fs-label);font-weight:600;line-height:24px;pointer-events:none;z-index:4}
.pill.l{left:12px}.pill.r{right:12px}
.cframe{position:absolute;z-index:3;box-shadow:0 0 0 2000px rgba(11,11,11,.72);outline:1px solid rgba(255,255,255,.85);touch-action:none}
.cframe .g{position:absolute;inset:0;opacity:0;transition:opacity var(--d-fast) ease;pointer-events:none;background:
  linear-gradient(90deg,transparent calc(33.333% - .5px),rgba(255,255,255,.55) calc(33.333% - .5px) calc(33.333% + .5px),transparent 0,transparent calc(66.667% - .5px),rgba(255,255,255,.55) calc(66.667% - .5px) calc(66.667% + .5px),transparent 0),
  linear-gradient(transparent calc(33.333% - .5px),rgba(255,255,255,.55) calc(33.333% - .5px) calc(33.333% + .5px),transparent 0,transparent calc(66.667% - .5px),rgba(255,255,255,.55) calc(66.667% - .5px) calc(66.667% + .5px),transparent 0)}
.cframe.fine .g{background-size:16.667% 16.667%;background-image:linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px)}
.cframe.drag .g,.cframe.fine .g{opacity:1}
.hd{position:absolute;width:44px;height:44px;touch-action:none}
.hd::before{content:"";position:absolute;width:20px;height:20px;border:0 solid var(--ph-g4)}
.hd.nw{left:-22px;top:-22px}.hd.nw::before{left:19px;top:19px;border-left-width:3px;border-top-width:3px}
.hd.ne{right:-22px;top:-22px}.hd.ne::before{right:19px;top:19px;border-right-width:3px;border-top-width:3px}
.hd.sw{left:-22px;bottom:-22px}.hd.sw::before{left:19px;bottom:19px;border-left-width:3px;border-bottom-width:3px}
.hd.se{right:-22px;bottom:-22px}.hd.se::before{right:19px;bottom:19px;border-right-width:3px;border-bottom-width:3px}
.split{position:absolute;top:0;bottom:0;width:44px;margin-left:-22px;z-index:4;touch-action:none;display:flex;justify-content:center}
.split::before{content:"";width:2px;height:100%;background:var(--ph-g4);box-shadow:0 0 6px rgba(0,0,0,.5)}
.split i{position:absolute;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;background:var(--ph-g4);color:var(--ph-g0);display:grid;place-items:center}
.split i .ic{width:18px;height:18px}

.deck{flex:none;position:relative;z-index:2;background:var(--ph-g1);padding-bottom:var(--ph-deck-pad)}
.ctl{position:relative;min-height:var(--ph-dial-h);display:flex;flex-direction:column;justify-content:center}
.ctl.anim>*{animation:fadeup var(--d-quick) var(--ease-out) both}
.ctlrow{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px 4px}
.ctlcol{display:flex;flex-direction:column;gap:8px;padding:12px 16px 8px}
@keyframes fadeup{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* The dial */
.dial{position:relative;height:var(--ph-dial-h);padding-top:8px;touch-action:none;outline:none;cursor:grab;flex:none}
.dial:focus-visible{outline:2px solid var(--ph-accent);outline-offset:-2px}
.dread{height:24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:8px;padding-inline:16px;pointer-events:none}
.dname{justify-self:end;font-size:var(--fs-small);font-weight:500;color:var(--ph-g3);white-space:nowrap}
.dval{font-size:var(--fs-strong);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ph-g4);white-space:nowrap;transition:color var(--d-fast) ease}
.dword{justify-self:start;font-size:var(--fs-label);color:var(--ph-g3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
:root:not([data-dial="b"]) .dial.on .dval{color:var(--ph-accent)}
.drul{position:relative;height:40px}
.dcv{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
.dptr{position:absolute;left:50%;top:0;width:2px;height:30px;margin-left:-1px;border-radius:1px;background:var(--ph-accent);transform-origin:50% 100%;pointer-events:none}
.dptr::before{content:"";position:absolute;left:-3px;top:-2px;border:4px solid transparent;border-top:5px solid var(--ph-accent);border-bottom:0}
.dbub{position:absolute;z-index:6;top:-40px;left:50%;height:32px;padding:0 12px;border-radius:var(--r-s);background:var(--ph-accent);color:var(--ph-on-accent);display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,6px) scale(.9);transition:opacity var(--d-fast) ease,transform var(--d-fast) var(--ease-out);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.dbub b{font-size:var(--fs-strong);font-weight:600;font-variant-numeric:tabular-nums}
.dbub span{font-size:var(--fs-label);font-weight:500;opacity:.75}
.dbub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ph-accent);border-bottom:0}
:root[data-dial="b"] .dial.on .dbub{opacity:1;transform:translate(-50%,0) scale(1)}

/* Tool row: A icon over label, B labels in a scroller */
.tools{height:var(--ph-tools-h);display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding-inline:8px;overscroll-behavior:contain}
.tools::-webkit-scrollbar{display:none}
.ti{flex:1 0 60px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-label);font-weight:500;line-height:16px;color:var(--ph-g3);white-space:nowrap;transition:color var(--d-fast) ease}
.ti.on{color:var(--ph-accent)}
.ti .mod{position:absolute;top:6px;left:calc(50% + 12px);width:4px;height:4px;border-radius:50%;background:var(--ph-g4)}
.ti.on .mod{background:var(--ph-accent)}
.tools.anim .ti{animation:fadeup var(--d-quick) var(--ease-out) both;animation-delay:calc(var(--i,0) * 14ms)}
:root[data-tools="b"] .tools{align-items:center;gap:4px;padding-inline:12px}
:root[data-tools="b"] .ti{flex:none;flex-direction:row;height:32px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-chip);gap:6px}
:root[data-tools="b"] .ti .ic{display:none}
:root[data-tools="b"] .ti.on{background:var(--ph-g2)}
:root[data-tools="b"] .ti .mod{position:static;order:2}
.tools.lab{align-items:center;gap:4px;padding-inline:12px}
.tools.lab .ti{flex:none;flex-direction:row;height:32px;padding:0 12px;border-radius:var(--r-full);font-size:var(--fs-chip)}
.tools.lab .ti.on{background:var(--ph-g2);color:var(--ph-g4)}
.tools.acts{align-items:center;gap:8px;padding-inline:12px}
.tools.acts .grow{flex:1}

/* Panel bar: A icon over label, B icons with the active one named */
.bar{height:var(--ph-bar-h);display:flex;align-items:stretch;border-top:1px solid var(--ph-g2);padding-inline:4px;position:relative}
.pi{flex:1 1 0;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--fs-label);font-weight:500;line-height:16px;color:var(--ph-g3);transition:color var(--d-fast) ease}
.pi.on{color:var(--ph-g4)}
.pi .mod{position:absolute;top:8px;left:calc(50% + 12px);width:4px;height:4px;border-radius:50%;background:var(--ph-g3)}
.pi.on .mod{background:var(--ph-g4)}
.bar .ind{position:absolute;top:-1px;left:0;height:2px;border-radius:1px;background:var(--ph-g4);transition:transform var(--d-quick) var(--ease-emph),width var(--d-quick) var(--ease-emph)}
:root[data-bar="b"] .bar{align-items:center;padding-inline:8px;gap:2px}
:root[data-bar="b"] .bar .ind{display:none}
:root[data-bar="b"] .pi{flex:1 1 0;height:40px;flex-direction:row;gap:6px;border-radius:var(--r-full)}
:root[data-bar="b"] .pi span{display:none}
:root[data-bar="b"] .pi.on{flex:0 0 auto;padding:0 14px 0 10px;background:var(--ph-g2)}
:root[data-bar="b"] .pi.on span{display:inline;animation:fadein var(--d-quick) var(--ease-out) both}
:root[data-bar="b"] .pi .mod{top:6px;left:calc(50% + 8px)}
:root[data-bar="b"] .pi.on .mod{display:none}
.editor[data-mode="versions"] .bar{display:none}

/* Mix swatches, aspect chips, looks, versions */
.hues{display:flex;justify-content:space-between;padding:12px 16px 0}
.hue{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.hue i{width:24px;height:24px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform var(--d-fast) var(--ease-pop)}
.hue.on{box-shadow:inset 0 0 0 2px var(--ph-accent)}
.hue.on i{transform:scale(.8)}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.chip.d{background:var(--ph-g2);color:var(--ph-g4)}
.chip.d.on{background:var(--ph-g4);color:var(--ph-g0)}
.lgrid{height:clamp(150px,28dvh,232px);overflow-y:auto;overscroll-behavior:contain;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:12px 16px;align-content:start}
.lgrid .cap{grid-column:1/-1;text-align:left}
.lk{display:flex;flex-direction:column;gap:6px;min-width:0}
.lk canvas,.lk .none{width:100%;aspect-ratio:1;border-radius:var(--r-xs);display:block;background:var(--ph-g2);transition:box-shadow var(--d-fast) ease}
.lk .none{display:grid;place-items:center;color:var(--ph-g3)}
.lk span{font-size:var(--fs-label);line-height:16px;color:var(--ph-g3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk.on canvas,.lk.on .none{box-shadow:0 0 0 2px var(--ph-g1),0 0 0 4px var(--ph-accent)}
.lk.on span{color:var(--ph-g4)}
.vstrip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:16px 16px 8px}
.vstrip::-webkit-scrollbar{display:none}
.ver{flex:none;width:64px;display:flex;flex-direction:column;gap:4px;text-align:left}
.ver canvas{width:64px;height:80px;border-radius:var(--r-xs);display:block;background:var(--ph-g2);transition:box-shadow var(--d-fast) ease}
.ver.on canvas{box-shadow:0 0 0 2px var(--ph-g1),0 0 0 4px var(--ph-accent)}
.ver b{font-size:var(--fs-label);font-weight:500;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver span{font-size:var(--fs-x-11);line-height:14px;color:var(--ph-g3);white-space:nowrap}
.ver.add canvas{display:none}
.ver.add .box{width:64px;height:80px;border-radius:var(--r-xs);border:1.6px dashed var(--ph-g2);display:grid;place-items:center;color:var(--ph-g3)}

/* Sheets */
.dimmer{position:absolute;inset:0;z-index:20;background:var(--ph-dim);opacity:0;pointer-events:none;transition:opacity var(--d-base) var(--ease-out)}
.dimmer.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:-32px;z-index:21;max-height:calc(100% - 24px);background:var(--ph-g1);border-radius:var(--r-l) var(--r-l) 0 0;padding-bottom:32px;display:flex;flex-direction:column;transform:translateY(105%);transition:transform var(--d-quick) var(--ease-in);box-shadow:0 -16px 40px rgba(0,0,0,.5);visibility:hidden}
.sheet.open{transform:none;visibility:visible;transition:transform var(--d-sheet) var(--ease-sheet),visibility 0s}
.sheet.drag{transition:none}
.sheet.closing{visibility:visible}
.grab{flex:none;height:20px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:#3a3a3a}
.shead{flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 4px 16px;min-height:44px;touch-action:none}
.shead h2{flex:1;margin:0;font-size:var(--fs-strong);font-weight:600;line-height:1.25}
.shead h2 small{display:block;font-size:var(--fs-small);font-weight:400;color:var(--ph-g3);margin-top:2px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 16px;display:flex;flex-direction:column;gap:24px}
.sfoot{flex:none;padding:8px 16px 8px}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{margin:0;font-size:var(--fs-x-11);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ph-g3)}
.rows{display:flex;flex-direction:column}
.row{min-height:48px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ph-g2)}
.row:last-child{border-bottom:0}
.row .k{flex:1;min-width:0;font-size:var(--fs-body)}
.row .k small{display:block;font-size:var(--fs-small);color:var(--ph-g3)}
.row .v{font-size:var(--fs-body);color:var(--ph-g4);text-align:right;font-variant-numeric:tabular-nums}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px solid var(--ph-g2);font-size:var(--fs-chip);line-height:20px}
.kv>div:last-child{border-bottom:0}
.kv>div span:first-child{color:var(--ph-g3);flex:none}
.kv>div span:last-child{text-align:right;min-width:0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tri div{padding:12px;border-radius:var(--r-m);background:var(--ph-g0);display:flex;flex-direction:column;gap:2px}
.tri b{font-size:var(--fs-strong);font-weight:600;font-variant-numeric:tabular-nums}
.tri span{font-size:var(--fs-x-11);color:var(--ph-g3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.hist{width:100%;height:96px;border-radius:var(--r-m);background:var(--ph-g0);display:block}
.ex{display:inline-block;height:20px;padding:0 8px;border-radius:var(--r-full);background:var(--ph-g2);color:var(--ph-g3);font-size:var(--fs-x-11);font-weight:600;line-height:20px;letter-spacing:.02em;vertical-align:middle}
.drive{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-m);background:var(--ph-g0)}
.drive .dot{width:8px;height:8px;border-radius:50%;background:#4cc38a;flex:none}
.drive div{flex:1;min-width:0;font-size:var(--fs-chip)}
.drive small{display:block;color:var(--ph-g3);font-size:var(--fs-small)}
.prog{height:4px;border-radius:2px;background:var(--ph-g2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ph-g4);transition:width 120ms linear}
.sdial{margin-inline:-16px}

.toast{position:absolute;z-index:40;left:0;right:0;margin:0 auto;width:fit-content;bottom:24px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:var(--r-full);background:var(--ph-g4);color:var(--ph-g0);font-size:var(--fs-chip);font-weight:500;line-height:20px;text-align:center;opacity:0;transform:translateY(8px);transition:opacity var(--d-base) var(--ease-out),transform var(--d-base) var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ---------- Spec ---------- */
.spec .etop{border-bottom:1px solid var(--ph-g2)}
.spec .etop b{font-size:var(--fs-strong);font-weight:600;margin-left:4px}
.sp{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:32px;user-select:text;-webkit-user-select:text}
.sp section{display:flex;flex-direction:column;gap:12px}
.sp h2{margin:0;font-size:var(--fs-strong);font-weight:600;line-height:1.25;text-wrap:balance}
.sp p{margin:0;font-size:var(--fs-chip);line-height:1.5;color:var(--ph-g3);max-width:62ch}
.sp p b{color:var(--ph-g4);font-weight:600}
.sp table{width:100%;border-collapse:collapse;font-size:var(--fs-small);line-height:18px}
.sp td{padding:8px 0;border-bottom:1px solid var(--ph-g2);vertical-align:top}
.sp td:first-child{color:var(--ph-g3);padding-right:12px;width:38%}
.sp td:last-child{font-variant-numeric:tabular-nums}
.sp code{font:500 12px/1.4 var(--mono);color:var(--ph-g4)}
.stack{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--ph-g2);display:flex;flex-direction:column;font-size:var(--fs-label)}
.stack>div{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px dashed var(--ph-g2)}
.stack>div:last-child{border-bottom:0}
.stack>div b{font-weight:500}
.stack>div span{color:var(--ph-g3);font-variant-numeric:tabular-nums}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swatches div{border-radius:var(--r-m);border:1px solid var(--ph-g2);overflow:hidden;font-size:var(--fs-label)}
.swatches i{display:block;height:44px}
.swatches p{padding:8px;font-size:var(--fs-label);line-height:1.35}
.typerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--ph-g2)}
.typerow span:last-child{font:500 12px/1.4 var(--mono);color:var(--ph-g3);white-space:nowrap}
.icongrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.icongrid div{height:72px;border-radius:var(--r-m);background:var(--ph-g1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-x-11);color:var(--ph-g3)}
.icongrid .ic{color:var(--ph-g4)}
.rhythm{display:flex;align-items:flex-end;gap:12px}
.rhythm div{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px/1 var(--mono);color:var(--ph-g3)}
.rhythm i{display:block;width:16px;background:var(--ph-accent);opacity:.8;border-radius:2px}
.qs{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-chip);line-height:1.5;color:var(--ph-g3)}
.qs b{color:var(--ph-g4);font-weight:600}

@media (prefers-reduced-motion: reduce){:root:not([data-motion="full"]) .ctl.anim>*,:root:not([data-motion="full"]) .tools.anim .ti{animation:none}}
:root[data-motion="reduced"] .ctl.anim>*,:root[data-motion="reduced"] .tools.anim .ti{animation:none}
:root[data-motion="reduced"] .sheet{transform:none;opacity:0;transition:opacity var(--d-sheet) ease,visibility 0s var(--d-sheet)}
:root[data-motion="reduced"] .sheet.open{opacity:1;transition:opacity var(--d-sheet) ease}

  }
